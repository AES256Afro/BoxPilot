name: Release

# Tag a commit `vX.Y.Z` (matching package.json) and push the tag. The workflow checks the tree,
# waits for the install smoke test of the same commit to pass, then publishes a GitHub Release with
# generated notes. BoxPilot installs (System page → Update) download the tag tarball, build it,
# health-check it, and roll back on failure.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Publish the release.
      contents: write
      # Read the install smoke test's runs for the tagged commit (the wait below).
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Verify the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # The install smoke test (install-smoke.yml) is the only real install and upgrade of a commit on
      # Ubuntu 24.04 and 26.04, and it runs on pushes to main, never on pull requests: 1.156.0 went
      # out while it had been failing on main for three days. A release pushes its commit to main
      # together with the tag, so that test starts alongside this run; this waits for it, up to 75
      # minutes, checking once a minute, and refuses to publish unless a run for this very commit
      # succeeded. A run cancelled by a newer one for the same commit (its concurrency group) is no
      # verdict; the newer one is. A tag on a commit that never reached main has no run: start one
      # (Actions -> Install smoke test -> Run workflow, on the tag), then re-run this workflow.
      - name: Wait for the install smoke test of this commit to pass
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 75 * 60 ))
          while :; do
            # The verdict on the first line, then one line per run. A failed query is no verdict.
            if ! runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow install-smoke.yml --commit "${GITHUB_SHA}" --limit 20 \
              --json status,conclusion,event,headBranch,url --jq '
                (if any(.[]; .conclusion == "success") then "success"
                 elif any(.[]; .status != "completed") then "running"
                 elif any(.[]; .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") then "failed"
                 else "not run yet" end),
                (.[] | "  \(.status)/\(.conclusion) \(.event) \(.headBranch) \(.url)")')"; then
              runs="unknown (the runs could not be listed)"
            fi
            verdict="$(printf '%s\n' "$runs" | head -n 1)"
            printf '%s\n' "$runs" | tail -n +2
            case "$verdict" in
              success) echo "The install smoke test passed on ${GITHUB_SHA}."; exit 0 ;;
              failed) echo "::error::The install smoke test failed on ${GITHUB_SHA}; not publishing ${GITHUB_REF_NAME}. Fix it (or re-run it if it was the runner), then re-run this workflow."; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No install smoke test of ${GITHUB_SHA} passed within 75 minutes (${verdict}); not publishing ${GITHUB_REF_NAME}."
              exit 1
            fi
            echo "Install smoke test of ${GITHUB_SHA}: ${verdict}; checking again in 60 s."
            sleep 60
          done

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          instructions="$(cat <<NOTES

          ---

          **Update from BoxPilot:** System → *Update to ${GITHUB_REF_NAME}* (password approval; automatic rollback on a failed health check).

          **Update from the server:**

              curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/boxpilot-upgrade.sh | sudo sh -s -- ${GITHUB_REF_NAME}

          It checks the new version on the port /etc/boxpilot/boxpilot.env gives BoxPilot. Older versions always checked port 8787, so on a server where BoxPilot listens on another port their update from the System page rolls back: run this command once instead.
          NOTES
          )"
          # A release may already have been published by hand with notes describing what changed.
          # Keep those and append the update instructions rather than failing on the duplicate.
          if existing="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body 2>/dev/null)"; then
            case "$existing" in
              *"boxpilot-upgrade.sh"*) echo "Release ${GITHUB_REF_NAME} already carries the update instructions." ;;
              *) printf '%s\n%s\n' "$existing" "$instructions" > notes.md; gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md ;;
            esac
          else
            printf '%s\n' "$instructions" > notes.md
            gh release create "${GITHUB_REF_NAME}" --title "BoxPilot ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
          fi

  # The public demo (demo-site/, a Cloudflare Worker serving a frozen copy of the demo's answers)
  # follows every release. It was deployed by hand and sat at 1.219.0 while 1.240.1 shipped.
  #
  # Its own job, after the release is out: a demo that will not deploy never holds a release back,
  # and shows as this job failing. It needs one repository secret the owner creates,
  # CLOUDFLARE_API_TOKEN (Cloudflare dashboard, My Profile, API Tokens, the "Edit Cloudflare Workers"
  # template, limited to this account and the demo's two zones), and, when that token can see more
  # than one account, the repository variable CLOUDFLARE_ACCOUNT_ID. Until the secret exists the
  # job says so and passes: a fork, or this repository before the owner has made one, is not broken.
  demo:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Is there a token to deploy with
        id: token
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::The demo was not deployed: this repository has no CLOUDFLARE_API_TOKEN secret."
          fi

      - name: Check out repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      # Builds the pages, copies them beside the Worker, and records the demo's answers from the
      # real demo server started on this runner (scripts/demo-bundle.mjs).
      - name: Build the demo
        if: steps.token.outputs.present == 'true'
        run: npm run demo:publish

      # Wrangler is not a dependency of the project: one exact version, so a release does not
      # change what deploys it. An unset account id must be absent, not empty.
      - name: Deploy the demo
        if: steps.token.outputs.present == 'true'
        working-directory: demo-site
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx --yes wrangler@4.155.0 deploy

      # The Worker keeps the parsed answers in memory, so an instance from before the deploy can
      # answer with the old version for a moment: a few tries, each past the cache.
      - name: Check both addresses serve this release
        if: steps.token.outputs.present == 'true'
        run: |
          want="${GITHUB_REF_NAME#v}"
          for host in antifascist.work getnerp.com; do
            got=""
            for attempt in 1 2 3 4 5 6; do
              got="$(curl -fsS --max-time 15 "https://${host}/api/v1/health?release=${want}&try=${attempt}" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{console.log("")}})' || true)"
              [ "${got}" = "${want}" ] && break
              sleep 10
            done
            if [ "${got}" != "${want}" ]; then
              echo "::error::${host} serves ${got:-nothing readable}, not ${want}."
              exit 1
            fi
            echo "${host} serves ${got}."
          done
