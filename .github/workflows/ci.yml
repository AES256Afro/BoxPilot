name: CI

on:
  push:
    branches: [main, phase-0]
  pull_request:
  # The Catalog updates workflow opens its pull request with the workflow token, which starts no
  # pull_request runs, so it starts this one on the branch instead.
  workflow_dispatch:

# Same reason as the install smoke test: a release pushes two branches with one tree. Keyed by
# SHA so only the duplicate pair collapses — a different commit's run is a different answer and
# must never be cancelled by this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Check bounded runtime retention
        timeout-minutes: 3
        run: npm run check:retention -- --batches 6 --iterations 100

      - name: Build container
        run: docker build -t boxpilot:ci .

      - name: Verify interrupted package recovery on disposable Ubuntu
        run: |
          docker build -f tests/ubuntu/package-recovery.Dockerfile -t boxpilot-package-recovery-test:ci .
          docker run --rm --network none --cpus 2 --memory 768m --pids-limit 128 --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" boxpilot-package-recovery-test:ci

  # Needs the runner itself, not a container: real systemd ordering, loop devices, the kernel's
  # exFAT driver and the Docker daemon. It edits /etc/fstab and restarts Docker, which is why it
  # runs only here, on a machine thrown away afterwards. Also on 22.04, the oldest release BoxPilot
  # installs on, which differs where this job looks: systemd 249, from before a mount unit's start
  # waited for systemd to see the mount table (part 6d); Samba 4.15, which has no smbstatus --json;
  # and a 6.8 kernel, which clears the exFAT mark a write set at every sync.
  drive-shutdown-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Drives unmount after Docker stops and mount before it starts
        run: sudo env "PATH=${PATH}" BOXPILOT_DISPOSABLE_TEST=1 bash tests/ubuntu/drive-shutdown-order.sh

  # The port check an app runs before `compose up`: Dockge's Start failed on 2026-09-29 because
  # Tailscale Serve held its port on the tailnet address. The listeners come from the root task in
  # boxpilot-run@, the publish from real Docker, and a Python server on a dummy interface's
  # tailnet-range address stands in for tailscaled.
  port-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: A port held on one address is caught before a publish on every address
        run: sudo bash tests/ubuntu/port-preflight.sh "$(command -v node)"

  # share.mount and share.unmount run in boxpilot-run@, whose PrivateTmp= gives each task a mount
  # namespace of its own. Real systemd, a real Samba server and NFS server on the runner, and the
  # host's own mount table read before and after. Both LTS releases, as for the helper's automount.
  share-mount-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Shares mount and unmount on the host, not in the task's namespace
        run: sudo bash tests/ubuntu/share-mount-host.sh "$(command -v node)"

  # The agents runner's hard caps (M37) on real systemd: deploy/boxpilot-agents.service as shipped,
  # the real runner and a fake model burning three times the unit's processor quota. The service's
  # own cgroup must stay at or under CPUQuota=200% under load and idle near 0% afterwards. Both LTS
  # releases, since CPUWeight=idle and the cgroup counters are systemd's and the kernel's.
  agents-caps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The agents runner stays under its caps, and idles near 0%
        run: sudo bash tests/ubuntu/agents-caps.sh "$(command -v node)"
