name: CI

on:
  push:
    branches: [main, phase-0]
  pull_request:
  # The Catalog updates workflow opens its pull request with the workflow token, which starts no
  # pull_request runs, so it starts this one on the branch instead.
  workflow_dispatch:

# Same reason as the install smoke test: a release pushes two branches with one tree. Keyed by
# SHA so only the duplicate pair collapses — a different commit's run is a different answer and
# must never be cancelled by this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Check bounded runtime retention
        timeout-minutes: 3
        run: npm run check:retention -- --batches 6 --iterations 100

      - name: Build container
        run: docker build -t boxpilot:ci .

      - name: Verify interrupted package recovery on disposable Ubuntu
        run: |
          docker build -f tests/ubuntu/package-recovery.Dockerfile -t boxpilot-package-recovery-test:ci .
          docker run --rm --network none --cpus 2 --memory 768m --pids-limit 128 --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" boxpilot-package-recovery-test:ci

  # Needs the runner itself, not a container: real systemd ordering, loop devices, the kernel's
  # exFAT driver and the Docker daemon. It edits /etc/fstab and restarts Docker, which is why it
  # runs only here, on a machine thrown away afterwards. Also on 22.04, the oldest release BoxPilot
  # installs on, which differs where this job looks: systemd 249, from before a mount unit's start
  # waited for systemd to see the mount table (part 6d); Samba 4.15, which has no smbstatus --json;
  # and a 6.8 kernel, which clears the exFAT mark a write set at every sync.
  drive-shutdown-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Drives unmount after Docker stops and mount before it starts
        run: sudo env "PATH=${PATH}" BOXPILOT_DISPOSABLE_TEST=1 bash tests/ubuntu/drive-shutdown-order.sh

  # The port check an app runs before `compose up`: Dockge's Start failed on 2026-09-29 because
  # Tailscale Serve held its port on the tailnet address. The listeners come from the root task in
  # boxpilot-run@, the publish from real Docker, and a Python server on a dummy interface's
  # tailnet-range address stands in for tailscaled.
  port-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: A port held on one address is caught before a publish on every address
        run: sudo bash tests/ubuntu/port-preflight.sh "$(command -v node)"

  # share.mount and share.unmount run in boxpilot-run@, whose PrivateTmp= gives each task a mount
  # namespace of its own. Real systemd, a real Samba server and NFS server on the runner, and the
  # host's own mount table read before and after. Both LTS releases, as for the helper's automount.
  share-mount-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Shares mount and unmount on the host, not in the task's namespace
        run: sudo bash tests/ubuntu/share-mount-host.sh "$(command -v node)"

  # The file server's limits on a real Samba: a share that leads into a protected folder is refused
  # before smb.conf is written, root and system accounts get no Samba password, what BoxPilot
  # writes passes testparm and serves a share, and root cannot sign in even with a password set by
  # hand. Both LTS releases, since Samba's version differs between them.
  samba-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Shares stay out of protected folders, and root never signs in
        run: sudo bash tests/ubuntu/samba-boundaries.sh "$(command -v node)"

  # The agents runner's hard caps (M37) on real systemd: deploy/boxpilot-agents.service as shipped,
  # the real runner and a fake model burning three times the unit's processor quota. The service's
  # own cgroup must stay at or under CPUQuota=200% under load and idle near 0% afterwards. Both LTS
  # releases, since CPUWeight=idle and the cgroup counters are systemd's and the kernel's.
  agents-caps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The agents runner stays under its caps, and idles near 0%
        run: sudo bash tests/ubuntu/agents-caps.sh "$(command -v node)"

  # M39.2: whether the house keeps its DNS with the server off, against real dnsmasq (the resolver
  # GL.iNet and OpenWrt routers run): each server asked directly, the canary through a "router"
  # found in a "Pi-hole"'s query log, and the rehearsal with that Pi-hole really stopped, for a
  # router with a fallback and one without. Also the lease reader on the runner's own DHCP lease.
  # Both LTS releases: networkctl's JSON and dnsmasq differ between them.
  dns-fallback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The DNS check and the rehearsal tell a router with a fallback from one without
        run: sudo bash tests/ubuntu/dns-fallback.sh "$(command -v node)"

  # M39.2 for a server with a hand-set address, which has no DHCP lease to read: the real Pi-hole image
  # the catalog pins, asked directly by eight "devices" from their own addresses, and its own
  # database read read-only through `pihole-FTL sqlite3`, the way the helper reads it. The DNS check
  # must then say the house goes down with the server, from counts alone.
  pihole-askers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pi-hole's own log tells a static server that devices ask it directly
        run: sudo bash tests/ubuntu/pihole-askers.sh "$(command -v node)"

  # M39.3: the heartbeat on real systemd, deploy/boxpilot-heartbeat.service and .timer as shipped: off
  # until turned on, one bare GET per tick from a unit with no capabilities, a switch that is down
  # costs one quick try and no failed unit, and the address never leaves the credential store.
  heartbeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The heartbeat pings from its timer, and only when turned on
        run: sudo bash tests/ubuntu/heartbeat.sh "$(command -v node)"
