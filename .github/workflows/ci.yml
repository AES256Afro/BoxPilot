name: CI

on:
  push:
    branches: [main, phase-0]
  pull_request:

# Same reason as the install smoke test: a release pushes two branches with one tree, and the
# newest run is the only one whose answer is wanted.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Build container
        run: docker build -t boxpilot:ci .
