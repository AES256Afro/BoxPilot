# Every catalog manifest pins an exact image tag, and upstreams delete tags. When one goes, the
# manifest still validates and the app still appears in the catalog — installing it just fails with
# "manifest unknown", which is a bad way to find out. This asks the registries directly.
#
# Kept out of the main CI job on purpose: it is the only check that depends on the network, and a
# registry having a bad minute should not fail a pull request that never touched the catalog.
name: Catalog images

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: ["catalog/**", "scripts/catalog-check-images.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tags-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The check loads the catalog through server/catalog/index.mjs, which
      # imports `yaml`. Without an install this job cannot start, and it has
      # been failing that way on every scheduled run rather than reporting on
      # any tag: a check that cannot run looks exactly like a check that passes
      # nothing, and it went unnoticed for weeks.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Every pinned tag still exists
        run: node scripts/catalog-check-images.mjs
