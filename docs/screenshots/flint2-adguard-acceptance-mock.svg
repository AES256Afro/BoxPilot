<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset="0.62" stop-color="#0a1714"/><stop offset="1" stop-color="#14372f"/></linearGradient>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.muted{fill:#98aba6}.mint{fill:#64e1bc}.white{fill:#f4f7f6}.amber{fill:#f3cb82}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:12px;font-weight:700;letter-spacing:1.6px}.title{font-size:36px;font-weight:750}.head{font-size:20px;font-weight:700}.strong{font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="46" fill="#5a3c08"/><text x="34" y="29" class="sans amber small strong">MOCKED 0.36.0 PRODUCT STATE. No DNS query, password, router session, or network-setting read or write occurred.</text>
  <rect x="0" y="46" width="240" height="954" fill="#050c0b" opacity=".96"/><line x1="240" y1="46" x2="240" y2="1000" stroke="#1d302d"/>
  <rect x="22" y="75" width="38" height="38" rx="11" fill="#4de1b0"/><text x="35" y="102" class="sans" font-size="25" font-weight="800" fill="#06100e">B</text><text x="72" y="103" class="sans white" font-size="25" font-weight="800">BoxPilot</text>
  <g class="sans" font-size="14" fill="#8fa49f"><text x="32" y="170">OV  Overview</text><text x="32" y="213">AP  Applications</text><text x="32" y="256">NW  Network</text></g>
  <rect x="18" y="275" width="204" height="42" rx="9" fill="#16322d" stroke="#275047"/><text x="32" y="301" class="sans white small strong">RT  Routers</text>
  <g class="sans" font-size="14" fill="#8fa49f"><text x="32" y="352">RX  Repair Center</text><text x="32" y="395">VM  Virtual Machines</text><text x="32" y="438">BK  Backups</text><text x="32" y="481">MG  Migrations</text><text x="32" y="524">FL  Fleet</text><text x="32" y="567">GH  GitHub</text><text x="32" y="610">LG  Logs</text></g>
  <rect x="20" y="790" width="200" height="112" rx="12" fill="#0b1a17" stroke="#214139"/><text x="36" y="816" class="sans mint tiny strong">PRIVATE ADMINISTRATION</text><text x="36" y="843" class="sans muted tiny">Tailscale HTTPS | Funnel off</text><text x="36" y="874" class="sans muted tiny">v0.36.0 fixed gateway probes</text>
  <text x="285" y="92" class="sans mint label">BOXPILOT</text><text x="285" y="134" class="sans white title">Router checkpoints</text><text x="285" y="163" class="sans muted" font-size="16">Collect recovery evidence, then verify the observed gateway without a router login.</text>
  <rect x="1392" y="82" width="150" height="34" rx="17" fill="#102721" stroke="#285047"/><text x="1422" y="104" class="sans mint tiny strong">GUARDED MODE</text>
  <rect x="285" y="194" width="1257" height="50" rx="11" fill="#102b24" stroke="#24604f"/><text x="303" y="224" class="sans mint small strong">Observed gateway only</text><text x="461" y="224" class="sans muted small">Derived from Bigbox's one live default route. Physical model and AdGuard configuration are not remotely attested.</text>
  <rect x="285" y="265" width="745" height="558" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="296" class="sans mint label">FLINT 2 ADGUARD HOME DIRECT ACCEPTANCE</text><text x="308" y="329" class="sans white head">Recovery declarations complete</text><text x="308" y="354" class="sans muted small">Six fixed operator checks are required before an immutable no-write plan.</text>
  <rect x="308" y="377" width="699" height="74" rx="11" fill="#0d241f" stroke="#28574c"/><text x="325" y="408" class="mono mint" font-size="19" font-weight="700">192.168.8.1:53</text><text x="325" y="432" class="sans muted tiny">via eno1 | checkpoint 7a32... | firmware 4.8.2</text><rect x="845" y="396" width="142" height="31" rx="15" fill="#2c220f" stroke="#674d21"/><text x="862" y="416" class="sans amber tiny strong">MODEL UNVERIFIED</text>
  <g class="sans white tiny"><rect x="308" y="471" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="322" y="487" width="20" height="20" rx="5" fill="#55d9b2"/><text x="327" y="502" fill="#07110e" font-weight="800">✓</text><text x="354" y="502">AdGuard Home enabled locally</text><rect x="670" y="471" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="684" y="487" width="20" height="20" rx="5" fill="#55d9b2"/><text x="689" y="502" fill="#07110e" font-weight="800">✓</text><text x="716" y="502">Emergency resolver tested</text>
  <rect x="308" y="539" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="322" y="555" width="20" height="20" rx="5" fill="#55d9b2"/><text x="327" y="570" fill="#07110e" font-weight="800">✓</text><text x="354" y="570">Handle Client Requests reviewed</text><rect x="670" y="539" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="684" y="555" width="20" height="20" rx="5" fill="#55d9b2"/><text x="689" y="570" fill="#07110e" font-weight="800">✓</text><text x="716" y="570">Router mode confirmed</text>
  <rect x="308" y="607" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="322" y="623" width="20" height="20" rx="5" fill="#55d9b2"/><text x="327" y="638" fill="#07110e" font-weight="800">✓</text><text x="354" y="638">Single DHCP authority confirmed</text><rect x="670" y="607" width="337" height="56" rx="9" fill="#0b1b18" stroke="#29433e"/><rect x="684" y="623" width="20" height="20" rx="5" fill="#55d9b2"/><text x="689" y="638" fill="#07110e" font-weight="800">✓</text><text x="716" y="633">VPN and parental-control</text><text x="716" y="650">impact reviewed</text></g>
  <rect x="308" y="684" width="699" height="116" rx="11" fill="#0b1715" stroke="#334a45"/><rect x="308" y="684" width="699" height="40" rx="11" fill="#132823"/><text x="324" y="709" class="sans white small strong">Immutable acceptance plan</text><text x="812" y="709" class="mono amber tiny">revision 1 | expires in 13m</text>
  <g class="mono" font-size="12" fill="#afe5d5"><rect x="323" y="738" width="323" height="22" rx="6" fill="#0d251f"/><text x="333" y="753">UDP example.com :53</text><rect x="662" y="738" width="326" height="22" rx="6" fill="#0d251f"/><text x="672" y="753">TCP example.com :53</text><rect x="323" y="767" width="323" height="22" rx="6" fill="#0d251f"/><text x="333" y="782">UDP example.net :53</text><rect x="662" y="767" width="326" height="22" rx="6" fill="#0d251f"/><text x="672" y="782">UDP boxpilot.invalid :53</text></g>
  <rect x="1049" y="265" width="493" height="558" rx="15" fill="#0c1916" stroke="#203a35"/><text x="1072" y="296" class="sans mint label">EVIDENCE BOUNDARY</text><text x="1072" y="329" class="sans white head">What a passing run means</text><text x="1072" y="354" class="sans muted small">Bigbox reached DNS at the observed gateway and</text><text x="1072" y="374" class="sans muted small">received the four exact expected responses.</text>
  <g class="sans"><rect x="1072" y="399" width="447" height="70" rx="9" fill="#0b1715" stroke="#293e3a"/><text x="1088" y="423" class="white small strong">Not model attestation</text><text x="1088" y="447" class="muted tiny">The gateway is not remotely proven to be a Flint 2.</text><rect x="1072" y="481" width="447" height="70" rx="9" fill="#0b1715" stroke="#293e3a"/><text x="1088" y="505" class="white small strong">Not configuration inspection</text><text x="1088" y="529" class="muted tiny">AdGuard, filters, DHCP, and client use are not proven.</text><rect x="1072" y="563" width="447" height="70" rx="9" fill="#0b1715" stroke="#293e3a"/><text x="1088" y="587" class="white small strong">No privileged helper</text><text x="1088" y="611" class="muted tiny">Fixed TCP and UDP reads run unprivileged.</text><rect x="1072" y="645" width="447" height="70" rx="9" fill="#0b1715" stroke="#293e3a"/><text x="1088" y="669" class="white small strong">No setting change</text><text x="1088" y="693" class="muted tiny">No router, DHCP, DNS, VPN, client, or Tailscale write.</text></g>
  <rect x="1072" y="730" width="447" height="70" rx="9" fill="#2b220f" stroke="#6a5225"/><text x="1088" y="754" class="sans amber small strong">Recovery first</text><text x="1088" y="777" class="sans amber tiny">Keep the independent resolver available. Failure changes nothing.</text>
  <rect x="285" y="843" width="1257" height="92" rx="14" fill="#211b0f" stroke="#5b4923"/><text x="310" y="876" class="sans white" font-size="17" font-weight="700">Password approval is still required</text><text x="310" y="902" class="sans" font-size="13" fill="#cbbd9e">Staging creates a durable awaiting-approval job. The target and four queries cannot be edited.</text><rect x="1280" y="866" width="233" height="46" rx="9" fill="#4de1b0"/><text x="1305" y="894" class="sans" font-size="14" font-weight="800" fill="#06100d">Stage for password approval</text>
</svg>
