  <g class="m xs"><rect x="292" y="560" width="610" height="42" rx="8" fill="#0b1d19" stroke="#29433e"/><text x="308" y="586" class="a b">uptime-kuma  76 days</text><text x="510" y="586" class="w">8b0d9c2a...7ef1</text><text x="838" y="586" class="r b">forget</text><rect x="292" y="612" width="610" height="42" rx="8" fill="#0b1d19" stroke="#29433e"/><text x="308" y="638" class="a b">pi-hole      61 days</text><text x="510" y="638" class="w">ac63f441...10de</text><text x="838" y="638" class="r b">forget</text><rect x="292" y="664" width="610" height="42" rx="8" fill="#0b1d19" stroke="#29433e"/><text x="308" y="690" class="a b">keel         47 days</text><text x="510" y="690" class="w">d1c4aa90...bf32</text><text x="838" y="690" class="r b">forget</text></g>
  <rect x="292" y="716" width="610" height="30" rx="7" fill="#102b24" stroke="#24604f"/><text x="308" y="736" class="m g xs">kept: 9  |  local archives removed: 0  |  recovery objects changed: no</text>
  <g class="s u sm"><text x="946" y="578">1. Recompute per-application floors and the exact snapshot-set revision.</text><text x="946" y="610">2. Recheck application, backup, and protection tags for every snapshot.</text><text x="946" y="642">3. Forget only the three approved full snapshot ids.</text><text x="946" y="674">4. Read every remaining repository data pack.</text><text x="946" y="706">5. Prove candidates absent and every reviewed noncandidate present.</text><text x="946" y="738">6. Record confirmed partial removal before showing a later failure.</text></g>
  <rect x="270" y="786" width="1290" height="84" rx="14" fill="#251713" stroke="#5d3c31"/><text x="292" y="817" class="s w sm b">Separate owner-password approval required</text><text x="292" y="843" class="s u xs">Mount, repository, snapshot set, protection evidence, recovery references, copy floors, age, and active jobs are revalidated.</text><rect x="1300" y="805" width="238" height="44" rx="9" fill="#743326" stroke="#9d4f3d"/><text x="1322" y="832" class="s w sm b">Stage exact retention batch</text>
