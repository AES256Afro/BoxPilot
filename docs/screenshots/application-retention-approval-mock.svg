  <rect x="18" y="720" width="194" height="128" rx="12" fill="#081411" stroke="#214139"/><text x="32" y="746" class="s g xs b">PRIVATE ADMINISTRATION</text><text x="32" y="773" class="s u xs">Tailscale HTTPS</text><text x="32" y="793" class="s u xs">Funnel off</text><text x="32" y="823" class="s u xs">v0.60.0 application retention</text>
  <text x="270" y="89" class="s g xs b">IMMUTABLE HIGH-RISK PLAN</text><text x="270" y="132" class="s w lg b">Per-application retention</text><text x="270" y="160" class="s u sm">Forget only exact old independently protected snapshot references after every safety floor passes.</text>
  <rect x="1370" y="82" width="190" height="36" rx="18" fill="#102b24" stroke="#28624f"/><text x="1412" y="105" class="s g xs b">3 exact candidates</text>
  <rect x="270" y="188" width="1290" height="52" rx="11" fill="#2b220f" stroke="#6a5225"/><text x="290" y="219" class="s a sm"><tspan class="b">REPRESENTATIVE MOCK ONLY:</tspan> Bigbox has no independent mount, so the live UI remains blocked and has created no retention plan or mutation.</text>
  <rect x="270" y="264" width="630" height="190" rx="14" fill="#0c1916" stroke="#203a35"/><text x="292" y="292" class="s g xs b">NON-CONFIGURABLE POLICY</text><text x="292" y="324" class="s w md b">Required keep floors</text>
  <g class="s"><rect x="292" y="346" width="178" height="68" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="310" y="378" class="w b" font-size="22">3 per app</text><text x="310" y="400" class="u xs">newest protected copies</text><rect x="486" y="346" width="178" height="68" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="504" y="378" class="w b" font-size="22">30 days</text><text x="504" y="400" class="u xs">minimum snapshot age</text><rect x="680" y="346" width="198" height="68" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="698" y="378" class="w b" font-size="22">100 ids</text><text x="698" y="400" class="u xs">maximum bounded batch</text></g>
  <text x="292" y="438" class="s u xs">Failed restores, published Keel recovery references, and active application jobs are always kept.</text>
  <rect x="920" y="264" width="640" height="190" rx="14" fill="#0c1916" stroke="#203a35"/><text x="942" y="292" class="s g xs b">FIXED MUTATION BOUNDARY</text><text x="942" y="324" class="s w md b">No selector, schedule, or prune</text><text x="942" y="350" class="s u xs">The browser cannot supply a path, repository, password, application, selector,</text><text x="942" y="370" class="s u xs">retention rule, restic option, schedule, prune request, or deletion target.</text>
  <rect x="942" y="390" width="596" height="48" rx="8" fill="#102b24" stroke="#24604f"/><text x="958" y="410" class="m g xs">repository: fixed restic-applications  |  exact sorted ids only</text><text x="958" y="429" class="m g xs">full post-read: required  |  space reclaimed: false</text>
