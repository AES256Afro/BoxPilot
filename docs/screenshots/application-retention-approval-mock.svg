  <g class="s u sm"><text x="30" y="150">OV  Overview</text><text x="30" y="194">AP  Applications</text><text x="30" y="238">NW  Network</text><text x="30" y="282">RT  Routers</text><text x="30" y="326">RX  Repair Center</text><text x="30" y="370">VM  Virtual Machines</text></g>
