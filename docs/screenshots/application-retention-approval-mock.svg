  <rect width="1600" height="44" fill="#5a3c08"/><text x="34" y="28" class="s a sm b">MOCKED 0.60.0 PRODUCT STATE. No password, plan, job, repository read, snapshot forget, prune, application, archive, recovery object, or host change occurred.</text>
