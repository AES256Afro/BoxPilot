<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><linearGradient id="bg38" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset=".65" stop-color="#0a1714"/><stop offset="1" stop-color="#14372f"/></linearGradient><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:Menlo,Consolas,monospace}.w{fill:#f4f7f6}.u{fill:#98aba6}.g{fill:#64e1bc}.a{fill:#f3cb82}.xs{font-size:12px}.sm{font-size:14px}.lab{font-size:12px;font-weight:700;letter-spacing:1.6px}.hd{font-size:20px;font-weight:700}.b{font-weight:700}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg38)"/><rect width="1600" height="46" fill="#5a3c08"/><text x="34" y="29" class="s a sm b">MOCKED 0.38.0 PRODUCT STATE. No password, snapshot, database read, restore, service stop, file copy, or host change occurred.</text>
  <rect y="46" width="240" height="954" fill="#050c0b"/><line x1="240" y1="46" x2="240" y2="1000" stroke="#1d302d"/><rect x="22" y="75" width="38" height="38" rx="11" fill="#4de1b0"/><text x="35" y="102" class="s" font-size="25" font-weight="800" fill="#06100e">B</text><text x="72" y="103" class="s w" font-size="25" font-weight="800">BoxPilot</text>
  <g class="s" font-size="14" fill="#8fa49f"><text x="32" y="170">OV  Overview</text><text x="32" y="213">AP  Applications</text><text x="32" y="256">NW  Network</text><text x="32" y="299">RT  Routers</text><text x="32" y="342">RX  Repair Center</text><text x="32" y="385">VM  Virtual Machines</text></g><rect x="18" y="405" width="204" height="42" rx="9" fill="#16322d" stroke="#275047"/><text x="32" y="431" class="s w sm b">BK  Backups</text><g class="s" font-size="14" fill="#8fa49f"><text x="32" y="482">MG  Migrations</text><text x="32" y="525">FL  Fleet</text><text x="32" y="568">GH  GitHub</text><text x="32" y="611">LG  Logs</text></g><rect x="20" y="790" width="200" height="112" rx="12" fill="#0b1a17" stroke="#214139"/><text x="36" y="816" class="s g xs b">PRIVATE ADMINISTRATION</text><text x="36" y="843" class="s u xs">Tailscale HTTPS | Funnel off</text><text x="36" y="874" class="s u xs">v0.38.0 controller recovery</text>
  <text x="285" y="92" class="s g lab">BOXPILOT</text><text x="285" y="134" class="s w" font-size="36" font-weight="750">Backups and recovery</text><text x="285" y="163" class="s u" font-size="16">Prove recovery locally, then move verified artifacts outside Bigbox.</text><rect x="1349" y="82" width="193" height="34" rx="17" fill="#102721" stroke="#285047"/><text x="1373" y="104" class="s g xs b">OWNER APPROVAL REQUIRED</text>
  <rect x="285" y="194" width="1257" height="50" rx="11" fill="#102b24" stroke="#24604f"/><text x="303" y="224" class="s g sm b">WAL-aware controller source</text><text x="507" y="224" class="s u sm">A raw main-file copy can miss committed SQLite WAL state. The helper creates a consistent snapshot.</text>
  <rect x="285" y="265" width="775" height="225" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="296" class="s g lab">CONTROLLER STATE SOURCE</text><text x="308" y="329" class="s w hd">BoxPilot controller</text><text x="308" y="354" class="s u sm">Illustrative ready-to-stage state. Fixed database preflight passed.</text>
  <g class="s"><rect x="308" y="381" width="226" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="324" y="403" class="u xs">SOURCE</text><text x="324" y="427" class="w sm b">Fixed live SQLite</text><text x="324" y="449" class="m g xs">/var/lib/boxpilot</text><rect x="547" y="381" width="226" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="563" y="403" class="u xs">SNAPSHOT</text><text x="563" y="427" class="w sm b">WAL-aware</text><text x="563" y="449" class="m g xs">sqlite-vacuum-into</text><rect x="786" y="381" width="251" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="802" y="403" class="u xs">DOWNTIME</text><text x="802" y="427" class="w sm b">None</text><text x="802" y="449" class="m g xs">service remains online</text></g>
  <rect x="1077" y="265" width="465" height="225" rx="15" fill="#0c1916" stroke="#203a35"/><text x="1100" y="296" class="s g lab">TYPED HELPER BOUNDARY</text><text x="1100" y="329" class="s w hd">UUID only</text><text x="1100" y="354" class="s u sm">No database content returns to the web process.</text><g class="s"><rect x="1100" y="375" width="419" height="31" rx="7" fill="#0b1715" stroke="#29433e"/><text x="1115" y="395" class="w xs b">Fixed source, artifact, manifest, and drill roots</text><rect x="1100" y="416" width="419" height="31" rx="7" fill="#0b1715" stroke="#29433e"/><text x="1115" y="436" class="w xs b">No path, filename, command, selector, or retention</text><rect x="1100" y="457" width="419" height="20" rx="7" fill="#0b1715" stroke="#29433e"/><text x="1115" y="471" class="u xs">PrivateNetwork=true | no network required</text></g>
  <rect x="285" y="510" width="1257" height="312" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="541" class="s g lab">IMMUTABLE PLAN 6C7A...E021</text><text x="308" y="574" class="s w hd">BoxPilot controller: ready for approval</text><text x="308" y="607" class="s w sm b">Exact six-step workflow</text>
  <g class="s u" font-size="13"><text x="322" y="635">1. Inspect the fixed live database without returning content.</text><text x="322" y="661">2. Create one consistent root-only SQLite snapshot.</text><text x="322" y="687">3. Verify SHA-256, integrity, foreign keys, schema, and owner state.</text><text x="322" y="713">4. Copy into one generated isolated drill workspace.</text><text x="322" y="739">5. Open and reverify the copy, then remove only that workspace.</text><text x="322" y="765">6. Write a root-only manifest; keep production unchanged.</text></g>
  <rect x="960" y="603" width="559" height="91" rx="8" fill="#2b220f" stroke="#6a5225"/><text x="978" y="628" class="s a xs b">SAME-HOST RECOVERY EVIDENCE ONLY</text><text x="978" y="652" class="s a xs">Contains sensitive authentication and audit state.</text><text x="978" y="674" class="s a xs">Copy the complete directory to encrypted independent storage.</text><rect x="960" y="708" width="559" height="92" rx="8" fill="#0b1d19" stroke="#2b4a43"/><text x="978" y="732" class="m g xs">destination: local-managed | artifact mode: 0600</text><text x="978" y="755" class="m g xs">drill: isolated-copy-open | production replaced: false</text><text x="978" y="778" class="m g xs">service stopped: false | retention performed: false</text>
  <rect x="285" y="842" width="1257" height="90" rx="14" fill="#211b0f" stroke="#5b4923"/><text x="310" y="875" class="s w" font-size="17" font-weight="700">Stage now, approve separately in Repair Center</text><text x="310" y="901" class="s" font-size="13" fill="#cbbd9e">The owner password is never stored in the job payload or sent to the root helper.</text><rect x="1328" y="863" width="185" height="46" rx="9" fill="#4de1b0"/><text x="1352" y="891" class="s" font-size="14" font-weight="800" fill="#06100d">Stage for approval</text>
</svg>
