    <style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.w{fill:#f4f7f6}.u{fill:#98aba6}.g{fill:#59dfb6}.a{fill:#f3cb82}.b{font-weight:700}.xs{font-size:12px}.sm{font-size:14px}.md{font-size:18px}.lg{font-size:34px}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="44" fill="#5a3c08"/><text x="34" y="28" class="s a sm b">MOCKED 0.61.0 PRODUCT STATE. No live Bigbox capture, password, plan, job, import, VM, or host change occurred.</text>
  <rect x="0" y="44" width="230" height="856" fill="#050c0b" opacity=".95"/><line x1="230" y1="44" x2="230" y2="900" stroke="#1d302d"/><rect x="20" y="70" width="36" height="36" rx="10" fill="#4de1b0"/><text x="32" y="95" class="s b" font-size="22" fill="#06100e">B</text><text x="68" y="96" class="s w b" font-size="24">BoxPilot</text>
  <g class="s u sm"><text x="30" y="150">OV  Overview</text><text x="30" y="194">AP  Applications</text><text x="30" y="238">NW  Network</text><text x="30" y="282">RT  Routers</text><text x="30" y="326">RX  Repair Center</text></g><rect x="18" y="348" width="194" height="42" rx="9" fill="#16322d" stroke="#275047"/><text x="30" y="374" class="s w sm b">VM  Virtual Machines</text><g class="s u sm"><text x="30" y="424">BK  Backups</text><text x="30" y="468">MG  Migrations</text><text x="30" y="512">FL  Fleet</text><text x="30" y="556">GH  GitHub</text><text x="30" y="600">LG  Logs</text></g>
  <rect x="18" y="720" width="194" height="128" rx="12" fill="#081411" stroke="#214139"/><text x="32" y="746" class="s g xs b">PRIVATE ADMINISTRATION</text><text x="32" y="773" class="s u xs">Tailscale HTTPS</text><text x="32" y="793" class="s u xs">Funnel off</text><text x="32" y="823" class="s u xs">v0.61.0 guarded media import</text>
  <text x="270" y="89" class="s g xs b">VM INSTALLATION MEDIA</text><text x="270" y="132" class="s w lg b">Upload, verify, and import an ISO</text><text x="270" y="160" class="s u sm">Move installer media through a fixed staging boundary before it reaches the libvirt library.</text><rect x="1390" y="82" width="170" height="36" rx="18" fill="#102b24" stroke="#28624f"/><text x="1420" y="105" class="s g xs b">0 usable ISOs</text>
  <rect x="270" y="188" width="1290" height="52" rx="11" fill="#2b220f" stroke="#6a5225"/><text x="290" y="219" class="s a sm"><tspan class="b">REPRESENTATIVE MOCK ONLY:</tspan> filename, size, digest, plan, and approval are demonstration data. No live server data was captured.</text>
  <rect x="270" y="264" width="630" height="260" rx="14" fill="#0c1916" stroke="#203a35"/><text x="292" y="292" class="s g xs b">UNPRIVILEGED UPLOAD</text><text x="292" y="324" class="s w md b">Staged media</text><rect x="292" y="345" width="586" height="125" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="310" y="374" class="s w sm b">ubuntu-24.04.3-live-server-amd64.iso</text><text x="310" y="399" class="s u xs">3.2 GiB, complete upload pair</text><rect x="310" y="416" width="550" height="40" rx="7" fill="#102b24" stroke="#24604f"/><text x="325" y="434" class="m g xs">sha256: 9d8c...8b31  |  staging: fixed private inbox</text><text x="325" y="450" class="m g xs">free-space reserve: 1 GiB</text><text x="292" y="494" class="s u xs">The web service can write only the private staging inbox.</text><text x="292" y="512" class="s u xs">It cannot write the libvirt media library.</text>
  <rect x="920" y="264" width="640" height="260" rx="14" fill="#0c1916" stroke="#203a35"/><text x="942" y="292" class="s g xs b">IMMUTABLE REVIEW</text><text x="942" y="324" class="s w md b">Exact import plan</text><rect x="942" y="345" width="596" height="62" rx="8" fill="#102b24" stroke="#24604f"/><text x="958" y="365" class="m g xs">destination: /var/lib/libvirt/boot  |  overwrite: disabled</text><text x="958" y="385" class="m g xs">size + sha256 + candidate revision: pinned</text><g class="s u xs"><circle cx="958" cy="431" r="13" fill="#16322d"/><text x="954" y="435" class="g b">1</text><text x="982" y="435">Revalidate the exact staged pair and metadata.</text><circle cx="958" cy="463" r="13" fill="#16322d"/><text x="954" y="467" class="g b">2</text><text x="982" y="467">Copy through a generated partial and hash it.</text><circle cx="958" cy="495" r="13" fill="#16322d"/><text x="954" y="499" class="g b">3</text><text x="982" y="499">Publish without overwrite, then hash again.</text></g>
  <rect x="270" y="548" width="1290" height="222" rx="14" fill="#0c1916" stroke="#203a35"/><text x="292" y="576" class="s g xs b">PRIVILEGED HELPER BOUNDARY</text><text x="292" y="608" class="s w md b">What the approval can and cannot change</text><text x="292" y="641" class="s w sm b">Exact changes</text><rect x="292" y="654" width="574" height="82" rx="8" fill="#102b24" stroke="#24604f"/><text x="308" y="677" class="m g xs">create one generated partial</text><text x="308" y="697" class="m g xs">publish one named ISO without overwrite</text><text x="308" y="717" class="m g xs">remove approved staging pair only after success</text><text x="922" y="641" class="s w sm b">Excluded from this job</text><rect x="922" y="654" width="616" height="82" rx="8" fill="#102b24" stroke="#24604f"/><text x="938" y="677" class="m g xs">no VM definition or start  |  no libvirt network change</text><text x="938" y="697" class="m g xs">no arbitrary destination or URL</text><text x="938" y="717" class="m g xs">no existing media replacement</text>
  <rect x="270" y="794" width="1290" height="76" rx="14" fill="#10201c" stroke="#315044"/><text x="292" y="823" class="s w sm b">Review first, approve separately</text><text x="292" y="846" class="s u xs">Staging this immutable plan sends it to Repair Center. It does not import the ISO.</text><rect x="1285" y="811" width="253" height="42" rx="9" fill="#237159" stroke="#3b9478"/><text x="1306" y="837" class="s w sm b">Stage exact media import</text>
</svg>
