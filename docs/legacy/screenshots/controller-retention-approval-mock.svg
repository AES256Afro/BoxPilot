<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg40" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset=".72" stop-color="#0a1714"/><stop offset="1" stop-color="#173b31"/></linearGradient>
    <style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:Menlo,Consolas,monospace}.w{fill:#f4f7f6}.u{fill:#98aba6}.g{fill:#64e1bc}.a{fill:#f3cb82}.r{fill:#ffb8a7}.xs{font-size:12px}.sm{font-size:14px}.lab{font-size:12px;font-weight:700;letter-spacing:1.6px}.hd{font-size:20px;font-weight:700}.b{font-weight:700}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg40)"/><rect width="1600" height="46" fill="#5a3c08"/><text x="34" y="29" class="s a sm b">MOCKED 0.40.0 PRODUCT STATE. No password, plan, job, repository read, snapshot forget, prune, database open, artifact removal, or host change occurred.</text>
  <rect y="46" width="240" height="954" fill="#050c0b"/><line x1="240" y1="46" x2="240" y2="1000" stroke="#1d302d"/><rect x="22" y="75" width="38" height="38" rx="11" fill="#4de1b0"/><text x="35" y="102" class="s" font-size="25" font-weight="800" fill="#06100e">B</text><text x="72" y="103" class="s w" font-size="25" font-weight="800">BoxPilot</text>
  <g class="s" font-size="14" fill="#8fa49f"><text x="32" y="170">OV  Overview</text><text x="32" y="213">AP  Applications</text><text x="32" y="256">NW  Network</text><text x="32" y="299">RT  Routers</text><text x="32" y="342">RX  Repair Center</text><text x="32" y="385">VM  Virtual Machines</text></g><rect x="18" y="405" width="204" height="42" rx="9" fill="#16322d" stroke="#275047"/><text x="32" y="431" class="s w sm b">BK  Backups</text><g class="s" font-size="14" fill="#8fa49f"><text x="32" y="482">MG  Migrations</text><text x="32" y="525">FL  Fleet</text><text x="32" y="568">GH  GitHub</text><text x="32" y="611">LG  Logs</text></g><rect x="20" y="790" width="200" height="112" rx="12" fill="#0b1a17" stroke="#214139"/><text x="36" y="816" class="s g xs b">PRIVATE ADMINISTRATION</text><text x="36" y="843" class="s u xs">Tailscale HTTPS | Funnel off</text><text x="36" y="874" class="s u xs">v0.40.0 controller retention</text>
  <text x="285" y="88" class="s g lab">IMMUTABLE HIGH-RISK PLAN</text><text x="285" y="130" class="s w" font-size="36" font-weight="750">Fixed controller retention</text><text x="285" y="159" class="s u" font-size="16">Forget only exact old protected snapshot references after every safety floor passes.</text><rect x="1360" y="78" width="182" height="34" rx="17" fill="#102b24" stroke="#28624f"/><text x="1382" y="100" class="s g xs b">2 EXACT CANDIDATES</text>
  <rect x="285" y="188" width="1257" height="50" rx="11" fill="#2b220f" stroke="#6a5225"/><text x="303" y="218" class="s a sm b">Representative mock only</text><text x="484" y="218" class="s u sm">Homebox has no independent mount today, so its live UI remains blocked and has created no plan or mutation.</text>
  <rect x="285" y="258" width="610" height="236" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="289" class="s g lab">NON-CONFIGURABLE POLICY</text><text x="308" y="322" class="s w hd">Required keep floors</text>
  <g class="s"><rect x="308" y="344" width="171" height="72" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="324" y="375" class="g" font-size="24" font-weight="700">3</text><text x="324" y="399" class="u xs">newest protected copies</text><rect x="491" y="344" width="171" height="72" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="507" y="375" class="g" font-size="24" font-weight="700">30d</text><text x="507" y="399" class="u xs">minimum snapshot age</text><rect x="674" y="344" width="198" height="72" rx="9" fill="#0b1d19" stroke="#29433e"/><text x="690" y="375" class="g" font-size="24" font-weight="700">100</text><text x="690" y="399" class="u xs">maximum ids per batch</text></g><text x="308" y="448" class="s u xs">Failed restores and active controller operations are always kept.</text><text x="308" y="470" class="s u xs">Unknown or missing repository snapshots block the run.</text>
  <rect x="912" y="258" width="630" height="236" rx="15" fill="#0c1916" stroke="#203a35"/><text x="935" y="289" class="s g lab">FIXED MUTATION BOUNDARY</text><text x="935" y="322" class="s w hd">No selector and no prune</text><text x="935" y="348" class="s u xs">No browser path, repository, password, selector, rule, schedule,</text><text x="935" y="369" class="s u xs">restic option, or prune request.</text><rect x="935" y="391" width="584" height="82" rx="9" fill="#102b24" stroke="#24604f"/><text x="952" y="414" class="m g xs">repository: fixed restic-controller</text><text x="952" y="434" class="m g xs">forget input: exact sorted ids only</text><text x="952" y="454" class="m g xs">full post-read: required | space reclaimed: false</text>
  <rect x="285" y="514" width="1257" height="341" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="545" class="s g lab">REVIEWED BOUNDED BATCH</text><text x="308" y="578" class="s w hd">Exact candidates and verification contract</text>
  <rect x="308" y="602" width="550" height="43" rx="8" fill="#161c1a" stroke="#29433e"/><text x="324" y="628" class="s a xs b">41 days</text><text x="430" y="628" class="m u xs">8b0d9c2a...7ef1</text><text x="788" y="628" class="s a xs b">FORGET</text><rect x="308" y="655" width="550" height="43" rx="8" fill="#161c1a" stroke="#29433e"/><text x="324" y="681" class="s a xs b">38 days</text><text x="430" y="681" class="m u xs">ac63f441...10de</text><text x="788" y="681" class="s a xs b">FORGET</text><rect x="308" y="710" width="550" height="93" rx="8" fill="#102b24" stroke="#24604f"/><text x="325" y="735" class="m g xs">kept: 4 reviewed snapshots</text><text x="325" y="758" class="m g xs">local artifacts removed: 0</text><text x="325" y="781" class="m g xs">live database changed: no</text>
  <g class="s u" font-size="13"><text x="905" y="611">1. Recompute the fixed policy and exact snapshot-set revision.</text><text x="905" y="640">2. Forget only the two approved full snapshot ids.</text><text x="905" y="669">3. Read every remaining repository data pack.</text><text x="905" y="698">4. Prove candidates absent and all reviewed noncandidates present.</text><text x="905" y="727">5. Record confirmed partial removal before showing a later failure.</text></g><rect x="885" y="750" width="634" height="77" rx="9" fill="#2b220f" stroke="#6a5225"/><text x="903" y="775" class="s a xs b">IRREVERSIBLE REFERENCE REMOVAL</text><text x="903" y="798" class="s a xs">Forget cannot be automatically rolled back. Pack data may remain because prune is disabled,</text><text x="903" y="818" class="s a xs">but BoxPilot does not claim that a forgotten snapshot is recoverable.</text>
  <rect x="285" y="875" width="1257" height="69" rx="14" fill="#251713" stroke="#5d3c31"/><text x="310" y="904" class="s w" font-size="17" font-weight="700">Separate owner-password approval required</text><text x="310" y="928" class="s u" font-size="13">Destination, snapshot set, protection evidence, policy candidates, and active jobs are revalidated before execution.</text><rect x="1300" y="887" width="219" height="43" rx="9" fill="#743326" stroke="#9d4f3d"/><text x="1318" y="914" class="s" font-size="13" font-weight="700" fill="#fff0eb">Stage exact retention batch</text>
</svg>
