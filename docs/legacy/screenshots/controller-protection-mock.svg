<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg39" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset=".7" stop-color="#0a1714"/><stop offset="1" stop-color="#14372f"/></linearGradient>
    <style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:Menlo,Consolas,monospace}.w{fill:#f4f7f6}.u{fill:#98aba6}.g{fill:#64e1bc}.a{fill:#f3cb82}.r{fill:#ffb8a7}.xs{font-size:12px}.sm{font-size:14px}.lab{font-size:12px;font-weight:700;letter-spacing:1.6px}.hd{font-size:20px;font-weight:700}.b{font-weight:700}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg39)"/><rect width="1600" height="46" fill="#5a3c08"/><text x="34" y="29" class="s a sm b">MOCKED 0.39.0 PRODUCT STATE. No password, repository, copy, snapshot, restore, database open, or host change occurred.</text>
  <rect y="46" width="240" height="954" fill="#050c0b"/><line x1="240" y1="46" x2="240" y2="1000" stroke="#1d302d"/><rect x="22" y="75" width="38" height="38" rx="11" fill="#4de1b0"/><text x="35" y="102" class="s" font-size="25" font-weight="800" fill="#06100e">B</text><text x="72" y="103" class="s w" font-size="25" font-weight="800">BoxPilot</text>
  <g class="s" font-size="14" fill="#8fa49f"><text x="32" y="170">OV  Overview</text><text x="32" y="213">AP  Applications</text><text x="32" y="256">NW  Network</text><text x="32" y="299">RT  Routers</text><text x="32" y="342">RX  Repair Center</text><text x="32" y="385">VM  Virtual Machines</text></g><rect x="18" y="405" width="204" height="42" rx="9" fill="#16322d" stroke="#275047"/><text x="32" y="431" class="s w sm b">BK  Backups</text><g class="s" font-size="14" fill="#8fa49f"><text x="32" y="482">MG  Migrations</text><text x="32" y="525">FL  Fleet</text><text x="32" y="568">GH  GitHub</text><text x="32" y="611">LG  Logs</text></g><rect x="20" y="790" width="200" height="112" rx="12" fill="#0b1a17" stroke="#214139"/><text x="36" y="816" class="s g xs b">PRIVATE ADMINISTRATION</text><text x="36" y="843" class="s u xs">Tailscale HTTPS | Funnel off</text><text x="36" y="874" class="s u xs">v0.39.0 controller protection</text>
  <text x="285" y="92" class="s g lab">BOXPILOT</text><text x="285" y="134" class="s w" font-size="36" font-weight="750">Backups and recovery</text><text x="285" y="163" class="s u" font-size="16">Local restore evidence and independent disaster protection are separate states.</text><rect x="1360" y="82" width="182" height="34" rx="17" fill="#2b220f" stroke="#6a5225"/><text x="1382" y="104" class="s a xs b">SETUP REQUIRED</text>
  <rect x="285" y="194" width="1257" height="50" rx="11" fill="#2b220f" stroke="#6a5225"/><text x="303" y="224" class="s a sm b">Honest Homebox state</text><text x="462" y="224" class="s u sm">No independent mount is configured, so staging is disabled and no protection claim is made.</text>
  <rect x="285" y="265" width="600" height="250" rx="15" fill="#0c1916" stroke="#6a5225"/><text x="308" y="296" class="s a lab">INDEPENDENT CONTROLLER DESTINATION</text><text x="308" y="329" class="s w hd">Setup required on Homebox</text><text x="308" y="354" class="s u sm">Read-only inspection failed closed with fixed guidance.</text>
  <g class="s"><rect x="308" y="377" width="554" height="34" rx="8" fill="#2b1b16" stroke="#6a3b30"/><text x="324" y="399" class="r xs b">Mount an exact writable filesystem at /mnt/boxpilot-backup</text><rect x="308" y="420" width="554" height="34" rx="8" fill="#2b1b16" stroke="#6a3b30"/><text x="324" y="442" class="r xs b">Use a different filesystem from state and local backups</text><rect x="308" y="463" width="554" height="34" rx="8" fill="#0b1d19" stroke="#2b4a43"/><text x="324" y="485" class="m g xs">sudo /opt/boxpilot/scripts/boxpilot-controller-restic-setup.sh</text></g>
  <rect x="902" y="265" width="640" height="250" rx="15" fill="#0c1916" stroke="#203a35"/><text x="925" y="296" class="s g lab">FIXED PROTECTION CONTRACT AFTER SETUP</text><text x="925" y="329" class="s w hd">Separate repository and recovery key</text><text x="925" y="354" class="s u sm">No browser path, password, repository, selector, or restic argument.</text>
  <g class="s"><rect x="925" y="377" width="286" height="52" rx="8" fill="#0b1d19" stroke="#2b4a43"/><text x="941" y="398" class="u xs">REPOSITORY</text><text x="941" y="418" class="m g xs">restic-controller</text><rect x="1223" y="377" width="296" height="52" rx="8" fill="#0b1d19" stroke="#2b4a43"/><text x="1239" y="398" class="u xs">RECOVERY KEY</text><text x="1239" y="418" class="m g xs">separate root:root 0600</text><rect x="925" y="441" width="594" height="56" rx="8" fill="#102b24" stroke="#24604f"/><text x="941" y="463" class="g xs b">SERVER INPUT: two UUIDs + two SHA-256 values + size + destination revision</text><text x="941" y="484" class="u xs">PrivateNetwork=true | no retention | no prune | production database unchanged</text></g>
  <rect x="285" y="535" width="1257" height="321" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="566" class="s g lab">GUARDED WORKFLOW PREVIEW</text><text x="308" y="599" class="s w hd">Exact backup protection evidence required</text>
  <g class="s u" font-size="13"><text x="322" y="631">1. Rehash the local database artifact and manifest; repeat integrity, foreign-key, schema, and owner-state checks.</text><text x="322" y="659">2. Snapshot the complete generated UUID directory into the fixed encrypted controller repository.</text><text x="322" y="687">3. Read every restic data pack and confirm the exact server-generated snapshot path and tags.</text><text x="322" y="715">4. Restore that exact snapshot with verification into a generated root-only no-network workspace.</text><text x="322" y="743">5. Rehash both restored files, reopen SQLite, repeat every database check, then remove the successful workspace.</text><text x="322" y="771">6. Record repository and snapshot ids only after encryption, independence, full read, and exact restore all pass.</text></g>
  <rect x="1055" y="612" width="464" height="105" rx="8" fill="#102b24" stroke="#24604f"/><text x="1073" y="638" class="s g xs b">PROTECTED ONLY AFTER RESTORE</text><text x="1073" y="662" class="m g xs">full repository read: required</text><text x="1073" y="685" class="m g xs">restore: exact snapshot + --verify</text><text x="1073" y="708" class="m g xs">database: isolated copy-open</text><rect x="1055" y="731" width="464" height="103" rx="8" fill="#2b220f" stroke="#6a5225"/><text x="1073" y="756" class="s a xs b">RECOVERY BOUNDARY</text><text x="1073" y="780" class="s a xs">Local backup and live database remain unchanged.</text><text x="1073" y="802" class="s a xs">Failed drills preserve root-only evidence.</text><text x="1073" y="824" class="s a xs">No forget, prune, overwrite, or automatic restore.</text>
  <rect x="285" y="877" width="1257" height="67" rx="14" fill="#191b19" stroke="#3f4d48"/><text x="310" y="906" class="s w" font-size="17" font-weight="700">Staging stays disabled until every destination blocker clears</text><text x="310" y="929" class="s u" font-size="13">The setup script runs only from the Homebox terminal and the recovery password never enters BoxPilot.</text><rect x="1335" y="889" width="184" height="42" rx="9" fill="#26302d" stroke="#475b55"/><text x="1362" y="915" class="s u sm b">Protection blocked</text>
</svg>
