  <rect x="285" y="530" width="616" height="295" rx="15" fill="#0c1916" stroke="#203a35"/><text x="308" y="561" class="s g lab">NODE-LOCAL GATE</text><text x="308" y="594" class="s w hd">Target must equal this device's gateway</text><text x="308" y="620" class="s u sm">One fixed local route read runs before DNS.</text><text x="308" y="643" class="m g xs">Linux: ip -j -4 route show default</text><text x="308" y="664" class="m g xs">macOS: route -n get default</text>
  <g class="s"><rect x="308" y="685" width="570" height="43" rx="8" fill="#0b1715" stroke="#29433e"/><line x1="308" y1="685" x2="308" y2="728" stroke="#4de1b0" stroke-width="3"/><text x="324" y="703" class="w xs b">One gateway only</text><text x="324" y="720" class="u xs">Missing or ambiguous route evidence fails closed.</text><rect x="308" y="739" width="570" height="43" rx="8" fill="#0b1715" stroke="#29433e"/><line x1="308" y1="739" x2="308" y2="782" stroke="#4de1b0" stroke-width="3"/><text x="324" y="757" class="w xs b">Exact address match</text><text x="324" y="774" class="u xs">Local gateway must equal the linked Homebox target.</text><rect x="308" y="793" width="570" height="20" rx="8" fill="#0b1715" stroke="#29433e"/><text x="324" y="807" class="u xs">Route evidence is not physical model attestation.</text></g>
