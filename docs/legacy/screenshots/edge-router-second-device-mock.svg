  <text x="285" y="92" class="s g lab">BOXPILOT</text><text x="285" y="134" class="s w" font-size="36" font-weight="750">Fleet and agents</text><text x="285" y="163" class="s u" font-size="16">Collect narrow node-local evidence without granting remote shell access.</text><rect x="1380" y="82" width="162" height="34" rx="17" fill="#102721" stroke="#285047"/><text x="1408" y="104" class="s g xs b">NO REMOTE SHELL</text>
  <rect x="285" y="194" width="1257" height="50" rx="11" fill="#102b24" stroke="#24604f"/><text x="303" y="224" class="s g sm b">Signed one-shot policy</text><text x="453" y="224" class="s u sm">Controller target from fresh Homebox evidence. Agent independently matches its own default gateway.</text>
