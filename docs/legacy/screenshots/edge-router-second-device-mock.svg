  <g class="s"><rect x="308" y="381" width="383" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="324" y="403" class="u xs">SIGNED AGENT</text><text x="324" y="427" class="w sm b">macbook-lan</text><text x="324" y="449" class="m g xs">ed25519 9f3a...2c81</text><rect x="708" y="381" width="383" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="724" y="403" class="u xs">FRESH CONTROLLER EVIDENCE</text><text x="724" y="427" class="w sm b">4 fixed checks passed</text><text x="724" y="449" class="m g xs">192.168.1.1:53 | 4m old</text><rect x="1108" y="381" width="411" height="79" rx="10" fill="#0b1b18" stroke="#29443e"/><text x="1124" y="403" class="u xs">RECOVERY LINK</text><text x="1124" y="427" class="w sm b">Checkpoint retained</text><text x="1124" y="449" class="m g xs">firmware 1.4.0</text></g>
