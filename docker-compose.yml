services:
  boxpilot:
    build: .
    image: boxpilot:0.30.0
    container_name: boxpilot
    restart: unless-stopped
    environment:
      BOXPILOT_HOST: 0.0.0.0
      BOXPILOT_PORT: 8787
      BOXPILOT_STATE_DIRECTORY: /tmp/boxpilot
      BOXPILOT_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${BOXPILOT_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
