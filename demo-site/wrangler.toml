name = "boxpilot-demo"
main = "worker.js"
compatibility_date = "2026-08-01"

# Declared before [assets], because a key written after a table header belongs to that table and
# these were silently swallowed into it once already.
# This domain previously served a game with two save games and no activity in two months; both
# were exported to ~/Projects/quiet-grid-backup-20260826 before it was removed.
routes = [
  { pattern = "antifascist.work", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker has to see every request: it answers the API from the frozen bundle and injects the
# world switcher into the page shell. Cloudflare serves assets before the Worker by default, which
# meant "/" came back as the bare index.html with no way to reach the empty or broken worlds.
run_worker_first = true
