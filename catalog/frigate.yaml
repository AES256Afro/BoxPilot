schemaVersion: 2
id: frigate
name: Frigate
category: Home automation
icon: "📹"
description: Records your cameras and watches the footage for people, cars and animals, so you look at the few clips that matter instead of hours of nothing. Works with Home Assistant.
website: https://frigate.video
risk: medium
image:
  reference: ghcr.io/blakeblackshear/frigate:0.17.2
  version: 0.17.2
shmSize: 512m
ports:
  - id: web
    label: Web UI
    container: 8971
    host: 8971
    exposure: lan
  - id: rtsp
    label: RTSP restream
    container: 8554
    host: 8554
    exposure: lan
    tailnet: address   # RTSP, not HTTP
  - id: webrtc
    label: WebRTC
    container: 8555
    host: 8555
    exposure: lan
    tailnet: address   # WebRTC signalling, not HTTP
volumes:
  - id: config
    label: Configuration and database
    container: /config
    path: config
  - id: media
    label: Recordings
    container: /media/frigate
    path: media
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: FRIGATE_RTSP_PASSWORD
    label: RTSP restream password
    type: password
    generate: true
    secret: true
health:
  kind: running
  stableSeconds: 20
  timeoutSeconds: 300
notes: "The image is about 7.5 GB, so the first install takes a while and wants the space. It starts with no cameras and prints a generated admin password to its log. Open Logs and look for \"Password:\" the first time. Add cameras by editing config/config.yaml under the app's data folder. Recordings grow quickly: point the Recordings volume at a disk with room, and set a retention period in Frigate's settings. Detection runs on the CPU unless you give it a Coral TPU or a GPU, which this manifest does not claim."
