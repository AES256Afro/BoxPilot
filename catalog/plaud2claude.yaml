schemaVersion: 2
id: plaud2claude
name: Plaud2Claude
category: AI
icon: "📨"
description: "Every new recording from your Plaud voice recorder becomes its own Claude session: the transcript and Plaud's own summary go to a scheduled task on your Claude account, which writes the meeting notes. Read them and keep chatting at claude.ai/code or in the Claude app. Runs on your Claude subscription; no model API key."
website: https://github.com/AES256Afro/Plaud2Claude
risk: low
# It holds a Plaud sign-in and a Claude trigger token, so it starts on the tailnet only.
defaultExposure: tailnet
image:
  reference: ghcr.io/aes256afro/plaud2claude:0.2.0
  version: "0.2.0"
user: "1000:1000"
ports:
  - id: web
    label: Web UI
    container: 8796
    host: 8796
    exposure: lan
volumes:
  - id: data
    label: Plaud sign-in and send record
    container: /data
    path: data
    description: The Plaud sign-in and the record of which recordings were sent to Claude, with their session links.
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: CLAUDE_ROUTINE_URL
    label: Claude fire URL
    description: The Fire URL of a Claude scheduled task's API trigger, from claude.ai/code/routines (Pro, Max, Team or Enterprise). The page's Set up Claude section shows the prompt to give the task.
    default: ""
  - name: CLAUDE_ROUTINE_TOKEN
    label: Claude token
    type: password
    secret: true
    description: The token generated for that API trigger. It is only ever sent to api.anthropic.com.
    default: ""
  - name: P2C_SYNC_EVERY
    label: Check every (minutes)
    type: number
    description: How often Plaud is checked for new recordings. 0 turns automatic checks off.
    default: "30"
  - name: P2C_SYNC_DAYS
    label: Look back (days)
    type: number
    description: How far back each check looks for recordings not yet sent.
    default: "3"
  - name: P2C_WAIT_FOR_SUMMARY
    label: Wait for Plaud's summary (minutes)
    type: number
    description: Plaud often finishes its summary a little after the transcript. A recording without one waits this long, then goes without it. 0 sends at once.
    default: "30"
  - name: P2C_LOOK
    label: Look
    description: The page's style, shared with OpenPlaud's looks.
    default: console
    options: ["console", "inbox", "timeline", "actions", "command", "board", "reader", "library", "calendar", "phone"]
  - name: P2C_ALLOWED_HOSTS
    label: Extra host names (optional)
    description: "Only needed if you open the page under your own domain name. Tailnet names, IP addresses and .local names always work."
    default: ""
  - name: P2C_PASSWORD
    label: Password
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Opens the page.
signIn:
  path: /
  port: web
  passwordEnv: P2C_PASSWORD
  note: The page asks for this password only; there is no username.
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Open the page with the password from this card and choose Start Plaud sign-in. Approve on Plaud's page; your
  browser then lands on a localhost:8199 address that does not load. Paste that address into the page within two
  minutes. Then, at claude.ai/code/routines, create a scheduled task with the prompt shown under Set up Claude, add an
  API trigger, and put its Fire URL and token in this app's settings. From then on each new recording opens as its
  own Claude session. Only recordings made after setup are sent on their own; Send now covers older ones. Claude
  allows 30 sends an hour per task.
