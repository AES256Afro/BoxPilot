schemaVersion: 2
id: audhdmap
name: AuDHDMAP
category: Knowledge
icon: "⌘"
description: "Private visual workspace with quick capture, keyboard navigation, recovery points, recoverable trash, connected Markdown notes, project views, spreadsheet-safe project handoff, previewed JSON import, complete backups, and low-fatigue themes."
website: https://github.com/AES256Afro/AuDHDMAP
risk: low
image:
  reference: ghcr.io/aes256afro/audhdmap:0.6.0
  version: "0.6.0"
ports:
  - id: web
    label: Web UI
    container: 3010
    host: 3033
    exposure: lan
volumes:
  - id: data
    label: Workspace, attachments, and recovery state
    container: /data
    path: data
env:
  - name: AUDHDMAP_ADMIN_USERNAME
    label: Owner username
    default: owner
    description: The username shown on the sign-in screen.
  - name: AUDHDMAP_ADMIN_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to open the workspace.
  - name: AUDHDMAP_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out without changing workspace data.
signIn:
  path: /
  port: web
  usernameEnv: AUDHDMAP_ADMIN_USERNAME
  passwordEnv: AUDHDMAP_ADMIN_PASSWORD
  note: BoxPilot generates the owner password during installation. AuDHDMAP stores maps, recoverable trash, attachments, and up to 10 server recovery points under the one managed data directory included in app backups. Its Export panel can also create a portable ZIP with attachment integrity checks.
health:
  kind: healthcheck
  timeoutSeconds: 180
notes: >-
  Use Quiet Canvas for the neutral default or switch to Signal Garden, Amber
  Operator, Workstation 84, or Paper Atlas under Visual settings. Keep the app
  on your LAN or behind BoxPilot's Tailscale reach option; no cloud account is
  required. Press Q for multi-line quick capture or Cmd/Ctrl+K to jump to any
  map, thought, or task. Deleted thoughts remain in recoverable trash until
  explicitly purged. Use Export for local recovery points, PDF, SVG, Markdown,
  plain text, project CSV, JSON, or a complete restorable ZIP. JSON import
  previews every replacement and creates a recovery point before it commits.
