schemaVersion: 2
id: audhdmap
name: AuDHDMAP
category: Knowledge
icon: "⌘"
description: "Private visual workspace for freely placed thoughts, connected Markdown notes, branch focus, editable outlines, task boards, timelines, Gantt views, attachments, and low-fatigue themes."
website: https://github.com/AES256Afro/AuDHDMAP
risk: low
image:
  reference: ghcr.io/aes256afro/audhdmap:0.1.0
  version: "0.1.0"
ports:
  - id: web
    label: Web UI
    container: 3010
    host: 3033
    exposure: lan
volumes:
  - id: data
    label: Workspace, attachments, and recovery state
    container: /data
    path: data
env:
  - name: AUDHDMAP_ADMIN_USERNAME
    label: Owner username
    default: owner
    description: The username shown on the sign-in screen.
  - name: AUDHDMAP_ADMIN_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to open the workspace.
  - name: AUDHDMAP_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out without changing workspace data.
signIn:
  path: /
  port: web
  usernameEnv: AUDHDMAP_ADMIN_USERNAME
  passwordEnv: AUDHDMAP_ADMIN_PASSWORD
  note: BoxPilot generates the owner password during installation. AuDHDMAP stores maps and attachments under the one managed data directory included in app backups.
health:
  kind: healthcheck
  timeoutSeconds: 180
notes: >-
  Use Quiet Canvas for the neutral default or switch to Signal Garden, Amber
  Operator, Workstation 84, or Paper Atlas under Visual settings. Keep the app
  on your LAN or behind BoxPilot's Tailscale reach option; no cloud account is
  required.
