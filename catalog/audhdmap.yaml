schemaVersion: 2
id: audhdmap
name: AuDHDMAP
category: Knowledge
icon: "⌘"
description: "Self-hosted mind maps and Markdown notes with Canvas, Outline, task views, file export, backup, and restore."
website: https://github.com/AES256Afro/AuDHDMAP
risk: low
image:
  reference: ghcr.io/aes256afro/audhdmap:0.7.2
  version: "0.7.2"
ports:
  - id: web
    label: Web UI
    container: 3010
    host: 3033
    exposure: lan
volumes:
  - id: data
    label: Workspace, attachments, and recovery state
    container: /data
    path: data
env:
  - name: AUDHDMAP_ADMIN_USERNAME
    label: Owner username
    default: owner
    description: The username shown on the sign-in screen.
  - name: AUDHDMAP_ADMIN_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to open the workspace.
  - name: AUDHDMAP_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out without changing workspace data.
signIn:
  path: /
  port: web
  usernameEnv: AUDHDMAP_ADMIN_USERNAME
  passwordEnv: AUDHDMAP_ADMIN_PASSWORD
  note: BoxPilot generates the owner password. Maps, attachments, trash, and up to 10 recovery points are stored in the managed data directory.
health:
  kind: healthcheck
  timeoutSeconds: 180
notes: >-
  Use Visual settings to choose a theme. Press Q for multi-line capture and
  Cmd/Ctrl+K to search maps, thoughts, and tasks. Export supports PDF, SVG,
  Markdown, text, CSV, JSON, and complete ZIP backup. JSON import shows a
  preview before replacement.
