schemaVersion: 2
id: vikunja
name: Vikunja
category: Productivity
icon: "✅"
description: "To-do lists, kanban boards, Gantt charts, and reminders for you and the family, with apps and CalDAV."
website: https://vikunja.io
risk: low
image:
  reference: vikunja/vikunja:2.5.0
  version: "2.5.0"
ports:
  - id: web
    label: Web UI
    container: 3456
    host: 3456
    exposure: lan
volumes:
  - id: files
    label: Attachments
    container: /app/vikunja/files
    path: files
  - id: db
    label: Database
    container: /db
    path: db
env:
  - name: VIKUNJA_SERVICE_PUBLICURL
    label: Address people use
    default: http://localhost:3456
  - name: VIKUNJA_DATABASE_TYPE
    default: "sqlite"
    fixed: true
  - name: VIKUNJA_DATABASE_PATH
    default: "/db/vikunja.db"
    fixed: true
  - name: VIKUNJA_SERVICE_JWTSECRET
    label: Session secret
    type: password
    secret: true
    generate: true
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "Register the first account on the login page, then turn registration off under the instance settings if it should stay private."
