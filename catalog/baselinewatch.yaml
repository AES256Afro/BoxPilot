# BoxPilot catalog manifest for BaselineWatch (schemaVersion 2); the copy proposed as
# BoxPilot/catalog/baselinewatch.yaml in AES256Afro/BoxPilot#472. `npm run check` validates it
# against BoxPilot's schema. Port 8790 is free in the BoxPilot catalog (BoxPilot itself is 8787).
schemaVersion: 2
id: baselinewatch
name: BaselineWatch
category: Monitoring
icon: "🛡️"
description: "Security news, CVEs and advisories in one timeline; a change register for NIST SP 800-53 and 800-171, FedRAMP's rules, DISA STIGs and Microsoft baselines, each control before and after with the publisher's reason; and STIG pages per platform with every rule's check, fix, SP 800-53 controls and CISA's advice. Read-only JSON API and MCP server for your agents."
website: https://github.com/AES256Afro/BaselineWatch
risk: low
image:
  reference: ghcr.io/aes256afro/baselinewatch:0.31.0
  version: "0.31.0"
ports:
  - id: web
    label: Web UI
    container: 8790
    host: 8790
    exposure: lan
volumes:
  - id: data
    label: Database and source snapshots
    container: /data
    path: data
    description: SQLite database plus every fetched copy of every standard, so a diff from a year ago can still be shown.
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: BW_BASE_URL
    label: Address people use
    description: Used in digest and notification links.
    default: http://localhost:8790
  - name: BW_PUBLIC_READ
    label: Anyone on the network can read
    type: boolean
    default: "true"
    description: BaselineWatch holds no private data. Reading is open; changing sources, watchlist and triage needs the owner once sign-in lands (M7).
  - name: BW_ADMIN_PASSWORD
    label: Owner password
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Needed to mark items, fetch sources and change the watchlist; reading needs nothing.
  - name: BW_SESSION_SECRET
    label: Session signing secret
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Changing it signs the owner out everywhere without touching data.
  - name: BW_NVD_API_KEY
    label: NVD API key (optional)
    type: password
    secret: true
    description: Free from nvd.nist.gov/developers. Raises the vulnerability feed from 5 to 50 requests per 30 seconds.
    default: ""
  - name: BW_NOTIFY_URL
    label: Notification URL (optional)
    description: "ntfy://<this server>:8093/baselinewatch, gotify://<this server>:8080/<token>, or an https:// webhook. Receives KEV additions, changes to CVEs in your watchlist, standard releases and the digest."
    default: ""
  - name: BW_DIGEST
    label: Digest
    description: How often the digest is written and sent.
    default: daily
    options: ["daily", "weekly", "off"]
  - name: BW_DIGEST_HOUR
    label: Digest hour
    type: number
    description: The local hour (0 to 23, in the time zone above) at which the digest runs.
    default: "7"
  - name: BW_LLM_URL
    label: Local model URL (optional)
    description: An Ollama address such as http://<this server>:11434. When set, each release with changes also gets a short generated summary, badged as generated, next to the publisher's own words.
    default: ""
  - name: BW_LLM_MODEL
    label: Local model name
    description: The Ollama model used for generated summaries. Any small instruction model works; it only ever sees text already on screen.
    default: "llama3.2:3b"
  - name: BW_LOOK
    label: Look
    description: How pages are drawn unless a browser chooses otherwise from the masthead. Console is the dense dashboard with panels and charts; Register is the paper look.
    default: console
    options: ["console", "register"]
  - name: BW_SCHEME
    label: Colours
    description: Light, dark, or whatever each device says. Each browser can pick its own from the masthead.
    default: system
    options: ["system", "light", "dark"]
signIn:
  path: /login
  port: web
  passwordEnv: BW_ADMIN_PASSWORD
  note: Reading is open to anyone who can reach the page. The owner password unlocks marking, fetching and the watchlist.
health:
  kind: healthcheck
  timeoutSeconds: 180
notes: >-
  The first fetch of each standard, ten seconds after start, loads its published history: NIST
  SP 800-53 opens on the real Release 5.1.1 to 5.2.0 diff within a minute or two. Open Sources
  to see what is followed. Under Watchlist add your products, the baselines you own and the
  packages you ship (ecosystem:name, such as npm:express) so advisories about them are marked and
  everything else is dimmed. The daily digest goes to the notification URL at 07:00 in your time
  zone. Agents can read everything at /api/v1 and over MCP at /mcp.
