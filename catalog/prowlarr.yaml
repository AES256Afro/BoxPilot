schemaVersion: 2
id: prowlarr
name: Prowlarr
category: Media automation
icon: "🧭"
description: One place for your torrent indexers. Add each site once, and Prowlarr keeps Sonarr and Radarr fed with all of them, tests them on a schedule, and takes the per-app indexer bookkeeping away entirely.
website: https://prowlarr.com
risk: medium
image:
  reference: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls157
  version: 2.5.2
ports:
  - id: web
    label: Web UI
    container: 9696
    host: 9696
    exposure: lan
volumes:
  - id: config
    label: Configuration
    container: /config
    path: config
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 10
  timeoutSeconds: 180
notes: "Add Sonarr and Radarr under Settings, Apps, each with its address (http://<this server>:8989 and :7878) and API key (their Settings, General); Prowlarr then pushes every indexer to both and keeps them in sync. Prowlarr itself holds no media, so there is no media folder here."
