schemaVersion: 2
id: guacamole
name: Apache Guacamole
category: Network
icon: "🥑"
description: Reach any desktop in your house from a browser tab — RDP to a Windows machine, VNC to a Mac, SSH to a server, with no client to install on whatever device you happen to be holding. This build bundles the database and the connection daemon, so it works on its own.
website: https://guacamole.apache.org
risk: medium
image:
  reference: abesnier/guacamole:1.6.0
  version: 1.6.0
ports:
  - id: web
    label: Web UI
    container: 8080
    host: 8106
    exposure: lan
volumes:
  - id: config
    label: Database and connection settings
    container: /config
    path: config
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: EXTENSIONS
    label: Extensions to load
    description: Comma-separated, for example auth-totp for two-factor sign-in or auth-duo. Leave empty for none.
health:
  kind: running
  stableSeconds: 30
  timeoutSeconds: 420
notes: "The first login is guacadmin / guacadmin — change it under Settings → Users before anything else, because this one account can reach every machine you add. Guacamole itself connects out to the machines you configure; nothing needs installing on them beyond the RDP, VNC or SSH server they already run."
