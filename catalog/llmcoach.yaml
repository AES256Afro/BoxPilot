schemaVersion: 2
id: llmcoach
name: LLMCoach
category: AI
icon: "🎓"
description: Teach small language models a specific job. Build a knowledge base by dropping files into the chat or a watched folder, chat with it, generate training data, fine-tune with LoRA and compare the results, with live logs and loss charts. A nightly loop retrains and keeps a new model only if it scores better. Uses this server's Ollama or any OpenAI-compatible server.
website: https://github.com/AES256Afro/LLMCoach
risk: low
image:
  reference: ghcr.io/aes256afro/llmcoach:0.4.0
  version: "0.4.0"
ports:
  - id: web
    label: Web UI
    container: 8000
    host: 8420
    exposure: lan
volumes:
  - id: data
    label: Projects, documents, datasets and trained models
    container: /data
    path: data
  - id: cache
    label: Downloaded base models
    container: /cache
    path: cache
    backup: false
    description: Base models downloaded for training and evaluation, often several GB each. Excluded from backups on purpose; they download again on first use.
  - id: inbox
    label: Inbox
    container: /inbox
    hostPath: /srv/llmcoach-inbox
    configurable: true
    description: Folder LLMCoach watches for new documents. Share it over SMB from Storage, or point it at a mounted network share, and files copied into it join the knowledge base. What LLMCoach adds is copied into its data, which is backed up, so this folder isn't.
env:
  - name: LLMCOACH_USERNAME
    label: Owner username
    default: owner
  - name: LLMCOACH_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to sign in.
  - name: LLMCOACH_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out.
  - name: LLMCOACH_OLLAMA_URL
    label: Where Ollama is
    description: The Ollama API. The default reaches this server's Ollama app while its reach is LAN. If Ollama is Tailscale-only, enter its tailnet address with port 11434.
    default: http://host.docker.internal:11434
  - name: LLMCOACH_HF_TOKEN
    label: Hugging Face token (optional)
    type: password
    description: Only needed to fine-tune gated base models such as Llama or Gemma. Create a read token at huggingface.co/settings/tokens and accept the model's license there first.
  - name: HF_HOME
    default: /cache/huggingface
    fixed: true
  - name: LLMCOACH_INBOX_DIR
    default: /inbox
    fixed: true
extraHosts:
  - host.docker.internal:host-gateway
connections:
  - app: ollama
    role: model server
    where: install Ollama first and pull a chat model and nomic-embed-text; LLMCoach reaches it at this server's port 11434
    note: Ollama is its own compose project, so LLMCoach reaches it through host.docker.internal rather than a container name.
signIn:
  path: /
  port: web
  usernameEnv: LLMCOACH_USERNAME
  passwordEnv: LLMCOACH_PASSWORD
  note: BoxPilot generates the owner password. Projects, documents, datasets and trained adapters are kept in the managed data folder and included in backups.
health:
  kind: healthcheck
  timeoutSeconds: 300
notes: "The dashboard shows whether LLMCoach can reach Ollama and which models it has; more model servers (llama.cpp, vLLM, LocalAI and others) can be added on its Providers page. Pull a chat model and nomic-embed-text in Ollama first. Without a GPU, training is limited to models under 1 B parameters (for example Qwen2.5-0.5B); the knowledge base, chat, dataset generation and evaluation all work on a CPU."
