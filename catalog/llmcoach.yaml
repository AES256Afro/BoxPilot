schemaVersion: 2
id: llmcoach
name: LLMCoach
category: AI
icon: "🎓"
description: Teach small language models a specific job. Build a searchable knowledge base from your documents, fine-tune a model on your own examples, and compare the results side by side, with live logs, loss charts and hardware stats. Uses this server's Ollama app to run models.
website: https://github.com/AES256Afro/LLMCoach
risk: low
image:
  reference: ghcr.io/aes256afro/llmcoach:0.1.1
  version: "0.1.1"
ports:
  - id: web
    label: Web UI
    container: 8000
    host: 8420
    exposure: lan
volumes:
  - id: data
    label: Projects, documents, datasets and trained models
    container: /data
    path: data
  - id: cache
    label: Downloaded base models
    container: /cache
    path: cache
    backup: false
    description: Base models downloaded for training, often several GB each. Excluded from backups on purpose; they download again on first use.
env:
  - name: LLMCOACH_USERNAME
    label: Owner username
    default: owner
  - name: LLMCOACH_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to sign in.
  - name: LLMCOACH_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out.
  - name: LLMCOACH_OLLAMA_URL
    label: Where Ollama is
    description: The Ollama API. The default reaches this server's Ollama app while its reach is LAN. If Ollama is Tailscale-only, enter its tailnet address with port 11434.
    default: http://host.docker.internal:11434
  - name: HF_HOME
    default: /cache/huggingface
    fixed: true
extraHosts:
  - host.docker.internal:host-gateway
connections:
  - app: ollama
    role: model server
    where: install Ollama first and pull a chat model and nomic-embed-text; LLMCoach reaches it at this server's port 11434
    note: Ollama is its own compose project, so LLMCoach reaches it through host.docker.internal rather than a container name.
signIn:
  path: /
  port: web
  usernameEnv: LLMCOACH_USERNAME
  passwordEnv: LLMCOACH_PASSWORD
  note: BoxPilot generates the owner password. Projects, documents, datasets and trained adapters are kept in the managed data folder and included in backups.
health:
  kind: healthcheck
  timeoutSeconds: 300
notes: "The dashboard's Ollama card shows whether LLMCoach can reach Ollama and which models it has. Training runs on the CPU until this server has a supported GPU, which suits models up to about 0.5 B; the knowledge base and chat work well on a CPU."
