schemaVersion: 2
id: baikal
name: Baïkal
category: Productivity
icon: "📆"
description: "CalDAV and CardDAV server: calendars and contacts that sync natively with iPhone, Android (DAVx5), macOS, and Thunderbird, no Nextcloud needed."
website: https://sabre.io/baikal
risk: low
image:
  reference: ckulka/baikal:0.10.1@sha256:658e9582f8d418392b4dfe7e816835b003694c8cb54ed0ba598eb5727b58fe22
  version: "0.10.1"
ports:
  - id: web
    label: Web UI
    container: 80
    host: 8127
    exposure: lan
volumes:
  - id: config
    label: Configuration
    container: /var/www/baikal/config
    path: config
  - id: specific
    label: Database
    container: /var/www/baikal/Specific
    path: specific
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "The first visit runs the setup wizard (admin password, SQLite is fine). Then create users under Users and Resources; clients use http://<this server>:8127/dav.php. This image still ships PHP 8.1, which stopped getting security fixes at the end of 2025; keep Baïkal on your home network or tailnet rather than publishing it to the internet."
