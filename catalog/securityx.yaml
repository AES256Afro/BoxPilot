# Porchlight, formerly SecurityX (schemaVersion 2). Source of truth: AES256Afro/Porchlight
# boxpilot/porchlight.yaml, whose CI validates it with this repository's validateManifest. The id,
# the image path and the older settings' names are the ones servers already have installed, so
# they keep the earlier name. The image is pinned by digest to a release's image index for amd64
# and arm64, with an SBOM and build provenance attached. It holds gitleaks and osv-scanner, pinned
# by checksum.
# Port 4747 is free (BoxPilot itself 8787, BaselineWatch 8790, TheySpy 8797). The scanned folder is
# mounted read-only, and the app starts on the tailnet only: a report names the files and commits
# where secrets were found (never the secrets themselves).
# The optional model is this server's Ollama app (port 11434 on the host), another server that
# speaks OpenAI's format, or a hosted provider under the owner's own API key. It is sent only what
# the page shows, never secret values or the monitor's admin token.
# The page can fetch repositories from GitHub into the data volume; the optional token is sent to
# GitHub only. The optional Cloudflare token is read-only and is sent to Cloudflare's API only.
schemaVersion: 2
id: securityx
name: Porchlight
category: Security
icon: "🔐"
description: "Scans the git repositories on this server for committed secrets (gitleaks, whole history, values redacted) and vulnerable dependencies (osv-scanner), ranked in one report. Also drives the Porchlight attack-surface monitor for domains you own: new hostnames, DNS changes, expiring certificates and missing security headers."
website: https://github.com/AES256Afro/Porchlight
risk: low
# A scan report names the files and commits where secrets were found, so it starts on the tailnet only.
defaultExposure: tailnet
image:
  reference: ghcr.io/aes256afro/securityx:0.12.0@sha256:99037dd99bdb1d101ebdea2654808d11d24d7974429ee6edf72d87ffbc876e7e
  version: "0.12.0"
user: "1000:1000"
ports:
  - id: web
    label: Web UI
    container: 4747
    host: 4747
    exposure: lan
volumes:
  - id: data
    label: Scan report and fetched repositories
    container: /data
    path: data
    description: The latest repository scan, which a new scan from the page replaces, and the copies of repositories fetched from GitHub.
  - id: repos
    label: Repositories to scan
    container: /repos
    hostPath: /srv/projects
    readOnly: true
    configurable: true
    backup: false
    description: Optional. Folder on this server whose git repositories are scanned, up to six levels down. Mounted read-only. Leave it as it is to scan only what the page fetches from GitHub.
# Reaches this server's Ollama app, which publishes port 11434 on the host, for the optional local model.
extraHosts: ["host.docker.internal:host-gateway"]
connections:
  - app: ollama
    role: Local model
    where: "Settings → Local model address and Local model"
    note: Optional. Explains findings, summarises the roadmap and a domain's changes, and answers questions about a scan.
env:
  - name: SECURITYX_UI_KEY
    label: Access key
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. The page asks for it once per browser tab. At least 32 characters if you replace it.
  - name: SECURITYX_MONITOR_URL
    label: Monitor address (optional)
    description: "The address `cf deploy` printed for your Porchlight monitor Worker, such as https://porchlight-monitor.example.workers.dev. Empty leaves the Domains page off."
    default: ""
  - name: SECURITYX_ADMIN_TOKEN
    label: Monitor admin token (optional)
    type: password
    secret: true
    description: The monitor's ADMIN_TOKEN. It is only ever sent to the monitor address above and never reaches the browser.
    default: ""
  - name: SECURITYX_GITHUB_TOKEN
    label: GitHub token (optional)
    type: password
    secret: true
    description: "Lets the page fetch your private repositories to scan. Make a fine-grained token on GitHub with read-only access to Contents for the repositories you want checked. It is only ever sent to GitHub and never reaches the browser. Empty fetches public repositories only."
    default: ""
  - name: PORCHLIGHT_CLOUDFLARE_TOKEN
    label: Cloudflare API token (optional)
    type: password
    secret: true
    description: "Lets the Cloudflare page audit every domain in your Cloudflare account. Make an API token on Cloudflare with Read permissions only; the page lists them under Settings → Cloudflare. It is only ever sent to Cloudflare's API and never reaches the browser or a model. Here the audit only reads: a change to your account can be approved only on the page of a computer that runs Porchlight itself. Empty: the Cloudflare page says how to connect."
    default: ""
  - name: PORCHLIGHT_SCAN_DEPTH
    label: Folder levels to look through
    description: "How far below the folder of repositories a scan looks for git repositories. 3 suits a folder of projects, or of folders of projects. Raise it for a deeper tree; a scan then takes longer to start."
    options: ["0", "1", "2", "3", "4", "5", "6"]
    default: "3"
  - name: PORCHLIGHT_SCAN_EVERY_HOURS
    label: Scan again by itself
    description: "Scans the folder of repositories, and what the page fetched from GitHub, again once the last scan is this old. The page shows what is new and what was fixed since the scan before. Nothing is sent anywhere: open the page to see the result."
    options:
      - { value: "", label: "Only when I ask" }
      - { value: "24", label: "Every day" }
      - { value: "168", label: "Every week" }
    default: ""
  - name: SECURITYX_LLM_PROVIDER
    label: Model provider (optional)
    description: "Which model explains and analyses findings. Empty or ollama: this server's Ollama app. compatible: another server that speaks OpenAI's format, such as LM Studio, at the model address below. anthropic, openai or deepseek: a hosted model, which needs the API key below and sends what the pages show to that company."
    default: ""
  - name: SECURITYX_LLM_API_KEY
    label: Model API key (optional)
    type: password
    secret: true
    description: "Your API key for a hosted provider. It is only ever sent to that provider and never reaches the browser. Not needed for Ollama."
    default: ""
  - name: SECURITYX_LLM_URL
    label: Local model address (optional)
    description: "This server's Ollama app is at http://host.docker.internal:11434. Empty turns the model features off: Explain, Summarise, Explain changes and Ask. The model only sees what the page shows, never secret values."
    default: ""
  - name: SECURITYX_LLM_MODEL
    label: Local model
    optionsFrom: ollama-models
    description: "The model's name in Ollama. Add it in the Ollama app first under exactly this name. Without a graphics card an answer takes from tens of seconds to a few minutes."
    default: hf.co/hauhaucs/qwen3.5-9b-uncensored-hauhaucs-aggressive:Q4_K_M
signIn:
  path: /
  port: web
  passwordEnv: SECURITYX_UI_KEY
  note: There is no username. Paste the access key when the page asks for it.
health:
  kind: healthcheck
  timeoutSeconds: 60
notes: >-
  Open the page, paste the access key, and choose what to check: fetch repositories from GitHub
  on the page (add a GitHub token here for private ones), or point "Repositories to scan" at a
  folder of checkouts on this server, which is mounted read-only. Secrets are found in
  the full commit history, so one deleted in a later commit is still reported and must be rotated;
  the report never holds the secret itself. Dependency scanning sends package names and versions
  to the OSV database (api.osv.dev). The Domains page needs the monitor's address and admin token:
  the monitor runs on Cloudflare, not on this server. The Cloudflare page audits your Cloudflare
  account's settings with a read-only API token set here; it never changes the account from this
  server. To have a local model explain findings and
  answer questions, install the Ollama app, add the model in its Models tab, and set Local model
  address and Local model here.
