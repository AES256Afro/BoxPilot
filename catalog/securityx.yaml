# SecurityX (schemaVersion 2). Source of truth: AES256Afro/SecurityX boxpilot/securityx.yaml,
# whose CI validates it with this repository's validateManifest. The image is pinned by digest
# to a release's image index for amd64 and arm64, with an SBOM and build provenance attached.
# It holds gitleaks and osv-scanner, pinned by checksum.
# Port 4747 is free (BoxPilot itself 8787, BaselineWatch 8790, TheySpy 8797). The scanned folder is
# mounted read-only, and the app starts on the tailnet only: a report names the files and commits
# where secrets were found (never the secrets themselves).
# The optional local model is this server's Ollama app, which publishes port 11434 on the host.
# It is sent only what the page shows, never secret values or the monitor's admin token.
schemaVersion: 2
id: securityx
name: SecurityX
category: Security
icon: "🔐"
description: "Scans the git repositories on this server for committed secrets (gitleaks, whole history, values redacted) and vulnerable dependencies (osv-scanner), ranked in one report. Also drives the SecurityX attack-surface monitor for domains you own: new hostnames, DNS changes, expiring certificates and missing security headers."
website: https://github.com/AES256Afro/SecurityX
risk: low
defaultExposure: tailnet
image:
  reference: ghcr.io/aes256afro/securityx:0.3.0@sha256:ba62518140ed1cad84f188eb4d5e68ec94913285f6208f2914b139a2088b8e24
  version: "0.3.0"
user: "1000:1000"
ports:
  - id: web
    label: Web UI
    container: 4747
    host: 4747
    exposure: lan
volumes:
  - id: data
    label: Latest scan report
    container: /data
    path: data
    description: The latest repository scan. A new scan from the page replaces it.
  - id: repos
    label: Repositories to scan
    container: /repos
    hostPath: /srv/projects
    readOnly: true
    configurable: true
    backup: false
    description: Folder on this server whose git repositories are scanned, up to six levels down. Mounted read-only.
extraHosts: ["host.docker.internal:host-gateway"]
connections:
  - app: ollama
    role: Local model
    where: "Settings → Local model address and Local model"
    note: Optional. Explains findings, summarises the roadmap and a domain's changes, and answers questions about a scan.
env:
  - name: SECURITYX_UI_KEY
    label: Access key
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. The page asks for it once per browser tab. At least 32 characters if you replace it.
  - name: SECURITYX_MONITOR_URL
    label: Monitor address (optional)
    description: "The address `cf deploy` printed for your SecurityX monitor Worker, such as https://securityx-monitor.example.workers.dev. Empty leaves the Domains page off."
    default: ""
  - name: SECURITYX_ADMIN_TOKEN
    label: Monitor admin token (optional)
    type: password
    secret: true
    description: The monitor's ADMIN_TOKEN. It is only ever sent to the monitor address above and never reaches the browser.
    default: ""
  - name: SECURITYX_LLM_URL
    label: Local model address (optional)
    description: "This server's Ollama app is at http://host.docker.internal:11434. Empty turns the model features off: Explain, Summarise, Explain changes and Ask. The model only sees what the page shows, never secret values."
    default: ""
  - name: SECURITYX_LLM_MODEL
    label: Local model
    optionsFrom: ollama-models
    description: "The model's name in Ollama. Add it in the Ollama app first under exactly this name. Without a graphics card an answer takes from tens of seconds to a few minutes."
    default: hf.co/hauhaucs/qwen3.5-9b-uncensored-hauhaucs-aggressive:Q4_K_M
signIn:
  path: /
  port: web
  passwordEnv: SECURITYX_UI_KEY
  note: There is no username. Paste the access key when the page asks for it.
health:
  kind: healthcheck
  timeoutSeconds: 60
notes: >-
  Point "Repositories to scan" at the folder that holds your checkouts before installing; it is
  mounted read-only. Open the page, paste the access key, and start a scan. Secrets are found in
  the full commit history, so one deleted in a later commit is still reported and must be rotated;
  the report never holds the secret itself. Dependency scanning sends package names and versions
  to the OSV database (api.osv.dev). The Domains page needs the monitor's address and admin token:
  the monitor runs on Cloudflare, not on this server. To have a local model explain findings and
  answer questions, install the Ollama app, add the model in its Models tab, and set Local model
  address and Local model here.
