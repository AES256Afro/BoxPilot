schemaVersion: 2
id: baserow
name: Baserow
category: Developer
icon: "📋"
description: "No-code database with a spreadsheet interface, forms, and an API; the open-source Airtable."
website: https://baserow.io
risk: low
image:
  reference: baserow/baserow:2.3.3@sha256:41adb3493379403946a493f30873f743bb65b19b5f387d630ec75f41e25d5b5b
  version: "2.3.3"
ports:
  - id: web
    label: Web UI
    container: 80
    host: 8133
    exposure: lan
volumes:
  - id: data
    label: Database and files
    container: /baserow/data
    path: data
# The setting that holds the app's public address, so Hosted domains watches it once it is set.
publicHostname:
  env: BASEROW_PUBLIC_URL
env:
  - name: BASEROW_PUBLIC_URL
    label: Address people use
    description: Must match how you open it.
    default: http://localhost:8133
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 600
notes: "The all-in-one image bundles PostgreSQL and Redis. The first visit creates the admin account."
