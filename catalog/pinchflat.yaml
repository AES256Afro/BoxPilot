schemaVersion: 2
id: pinchflat
name: Pinchflat
category: Media
icon: "📹"
description: "Follow YouTube channels and playlists and keep the videos on this server automatically, named and organised for Jellyfin and Plex."
website: https://github.com/kieraneglin/pinchflat
risk: low
image:
  reference: ghcr.io/kieraneglin/pinchflat:v2025.6.6@sha256:4e975edf58f0861a5cbfe8fc6aac4851ff5a02dfc3f05ffeea4982e3084a5a4a
  version: "2025.6.6"
ports:
  - id: web
    label: Web UI
    container: 8945
    host: 8945
    exposure: lan
volumes:
  - id: config
    label: Configuration and database
    container: /config
    path: config
  - id: downloads
    label: Downloads folder
    container: /downloads
    hostPath: /srv/pinchflat
    configurable: true
    backup: false
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "Add a media profile (quality and naming), then sources: channels or playlists to follow. Downloads are checked on a schedule."
