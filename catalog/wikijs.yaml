schemaVersion: 2
id: wikijs
name: Wiki.js
category: Knowledge
icon: "📘"
description: "Modern wiki with Markdown and visual editors, search, and many authentication options."
website: https://js.wiki
risk: low
image:
  reference: requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e
  version: "2.5.314"
ports:
  - id: web
    label: Web UI
    container: 3000
    host: 3012
    exposure: lan
volumes:
  - id: data
    label: Uploads and cache
    container: /wiki/data
    path: data
env:
  - name: DB_TYPE
    default: "postgres"
    fixed: true
  - name: DB_HOST
    default: "database"
    fixed: true
  - name: DB_PORT
    default: "5432"
    fixed: true
  - name: DB_NAME
    default: "wiki"
    fixed: true
  - name: DB_USER
    default: "wiki"
    fixed: true
  - name: DB_PASS
    label: Database password
    type: password
    secret: true
    generate: true
sidecars:
  - id: database
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    env:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - id: pgdata
        container: /var/lib/postgresql/data
        path: postgres
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "The first visit runs the setup wizard (admin account and site URL)."
