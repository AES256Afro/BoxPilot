schemaVersion: 2
id: wikijs
name: Wiki.js
category: Knowledge
icon: "📘"
description: "Modern wiki with Markdown and visual editors, search, and many authentication options."
website: https://js.wiki
risk: low
image:
  reference: requarks/wiki:2.5.314
  version: "2.5.314"
ports:
  - id: web
    label: Web UI
    container: 3000
    host: 3012
    exposure: lan
volumes:
  - id: data
    label: Uploads and cache
    container: /wiki/data
    path: data
env:
  - name: DB_TYPE
    default: "postgres"
    fixed: true
  - name: DB_HOST
    default: "database"
    fixed: true
  - name: DB_PORT
    default: "5432"
    fixed: true
  - name: DB_NAME
    default: "wiki"
    fixed: true
  - name: DB_USER
    default: "wiki"
    fixed: true
  - name: DB_PASS
    label: Database password
    type: password
    secret: true
    generate: true
sidecars:
  - id: database
    image: postgres:16.15-alpine
    env:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - id: pgdata
        container: /var/lib/postgresql/data
        path: postgres
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "The first visit runs the setup wizard (admin account and site URL)."
