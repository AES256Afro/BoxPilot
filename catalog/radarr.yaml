schemaVersion: 2
id: radarr
name: Radarr
category: Media automation
icon: "🎬"
description: Automates movies. Add a film once and it finds a release through your indexers (Prowlarr), hands it to your download client (qBittorrent), renames the finished file, and files it into your library where Jellyfin picks it up.
website: https://radarr.video
risk: medium
image:
  reference: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
  version: 6.3.0
ports:
  - id: web
    label: Web UI
    container: 7878
    host: 7878
    exposure: lan
volumes:
  - id: config
    label: Configuration
    container: /config
    path: config
  - id: media
    label: Media folder
    container: /data
    hostPath: /srv/media
    configurable: true
    backup: false
    description: The same folder qBittorrent uses, mounted at the same place inside (/data). That is what lets imports be instant hard-links on one filesystem instead of copies; downloads sit in /data/torrents and the library in /data/movies.
    subdirectories:
      - torrents
      - movies
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 10
  timeoutSeconds: 180
notes: "Point the root folder at /data/movies and the download client at qBittorrent on http://<this server>:8095 (category movies-radarr). Indexers arrive through Prowlarr, which pushes them here by itself. On a network-share media folder Radarr copies instead of hard-linking, which is fine, just slower."
