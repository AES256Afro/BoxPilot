schemaVersion: 2
id: radarr
name: Radarr
category: Media automation
icon: "🎞️"
description: "The same for films: keep a wanted list, and Radarr fetches them in the quality you chose and files them for your media server."
website: https://radarr.video
risk: low
image:
  reference: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
  version: 6.3.0.10514
ports:
  - id: web
    label: Web UI
    container: 7878
    host: 7878
    exposure: lan
volumes:
  - id: config
    label: Configuration and database
    container: /config
    path: config
  - id: media
    label: Media folder
    container: /data
    hostPath: /srv/media
    configurable: true
    backup: false
    description: Shared media root for the whole stack; subfolders for tv, movies, music, torrents, and usenet keep imports as instant hard-links.
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "Setup order: Prowlarr first (indexers), then a download client, then here under Settings → Download clients. Use /srv/media/movies inside the shared media folder so imports are instant hard-links."
