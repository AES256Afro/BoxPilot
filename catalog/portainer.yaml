schemaVersion: 2
id: portainer
name: Portainer CE
category: Developer
icon: "🐳"
description: Web UI for managing Docker containers, images, volumes, and stacks on this server.
website: https://www.portainer.io
# High (ADR-015): it is handed the Docker socket to write to and serves a page that starts containers,
# which is root on this server for whoever reaches that page.
risk: high
image:
  reference: portainer/portainer-ce:2.44.0-alpine@sha256:5376fd96f0bae14be7285ceb24c5cf9470dc23f19cdde74ff4c65d11cbe96eb2
  version: 2.44.0
ports:
  - id: web
    label: Web UI (HTTPS)
    container: 9443
    host: 9443
    exposure: lan
volumes:
  - id: data
    label: Portainer data
    container: /data
    path: data
  - id: docker
    label: Docker socket
    container: /var/run/docker.sock
    hostPath: /var/run/docker.sock
    description: Portainer needs the Docker socket to manage containers. This grants it full control of Docker.
health:
  kind: running
  stableSeconds: 10
notes: Open the web UI within a few minutes of install to create the admin account, or Portainer locks itself for security (restart it to get another window).
