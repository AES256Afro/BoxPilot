schemaVersion: 2
id: grafana
name: Grafana
category: Monitoring
icon: "📈"
description: Dashboards and charts for any metric source, whether Prometheus, databases, or simple JSON.
website: https://grafana.com/oss/grafana/
risk: medium
image:
  reference: grafana/grafana-oss:13.0.2
  version: 13.0.2
# Grafana's own image runs as 472; BoxPilot gives the data folder to that account, so the
# container has no reason to run as root.
user: "472:472"
extraHosts:
  - "host.docker.internal:host-gateway"
ports:
  - id: web
    label: Web UI
    container: 3000
    host: 3030
    exposure: lan
volumes:
  - id: data
    label: Data
    container: /var/lib/grafana
    path: data
env:
  - name: GF_SECURITY_ADMIN_USER
    label: Admin username
    default: admin
  - name: GF_SECURITY_ADMIN_PASSWORD
    label: Admin password
    type: password
    secret: true
    generate: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
files:
  - path: provisioning/datasources/boxpilot.yaml
    container: /etc/grafana/provisioning/datasources/boxpilot.yaml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://host.docker.internal:9090
          isDefault: true
signIn:
  path: /login
  usernameEnv: GF_SECURITY_ADMIN_USER
  passwordEnv: GF_SECURITY_ADMIN_PASSWORD
health:
  kind: running
  stableSeconds: 10
  timeoutSeconds: 180
notes: Sign in with the admin username and the generated password (Secrets on this card). If you have installed Prometheus, it is already configured as a data source; add a dashboard from Dashboards, New, Import (node-exporter's dashboard id is 1860).
