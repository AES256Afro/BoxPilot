schemaVersion: 2
id: loki
name: Loki
category: Monitoring
icon: "🪵"
description: "Log database for Grafana: ship container and system logs to it and search them next to your metrics."
website: https://grafana.com/oss/loki
risk: low
image:
  reference: grafana/loki:3.7.6
  version: "3.7.6"
user: "10001:10001"
ports:
  - id: web
    label: Web UI
    container: 3100
    host: 3100
    exposure: lan
volumes:
  - id: data
    label: Log storage
    container: /loki
    path: data
    backup: false
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
connections:
  - app: alloy
    role: log source
    where: install Grafana Alloy to ship this server's container logs here
  - app: grafana
    role: viewer
    where: add Loki as a data source in Grafana (done automatically if both are installed), then search under Explore
notes: "Runs with the built-in single-node config. Install Grafana Alloy to ship your container logs into it, and add it to Grafana as a Loki data source at http://<this server>:3100 (Grafana wires it automatically if both are installed)."
