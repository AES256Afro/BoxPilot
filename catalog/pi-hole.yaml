schemaVersion: 2
id: pi-hole
name: Pi-hole
category: DNS
icon: "🕳️"
description: Network-wide ad and tracker blocking DNS server. Pick blocklists below, then point your router's DNS at this server once it is running.
website: https://pi-hole.net
risk: high
image:
  reference: pihole/pihole:2026.07.2
  version: 2026.07.2
capabilities:
  - CAP_NET_BIND_SERVICE
  - CAP_SYS_NICE
  - CAP_CHOWN
  - CAP_SETUID
  - CAP_SETGID
  - CAP_DAC_OVERRIDE
  - CAP_FOWNER
ports:
  - id: dns-tcp
    label: DNS (TCP)
    container: 53
    host: 53
    exposure: lan
  - id: dns-udp
    label: DNS (UDP)
    container: 53
    host: 53
    protocol: udp
    exposure: lan
  - id: web
    label: Admin UI
    container: 80
    host: 8084
    exposure: lan
volumes:
  - id: config
    label: Configuration and gravity database
    container: /etc/pihole
    path: etc-pihole
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: FTLCONF_webserver_api_password
    label: Admin password
    description: Sign-in for the admin UI; shown under Secrets after install.
    type: password
    generate: true
  - name: FTLCONF_dns_upstreams
    label: Upstream DNS
    description: Where Pi-hole forwards the queries it does not block.
    default: 1.1.1.1;1.0.0.1
    options:
      - 1.1.1.1;1.0.0.1
      - 9.9.9.9;149.112.112.112
      - 8.8.8.8;8.8.4.4
      - 94.140.14.14;94.140.15.15
  - name: FTLCONF_dns_listeningMode
    default: all
    fixed: true
  - name: FTLCONF_misc_etc_dnsmasq_d
    default: "false"
    fixed: true
health:
  kind: healthcheck
  stableSeconds: 10
  timeoutSeconds: 300
setup:
  title: Blocklists
  note: Pi-hole ships with Steven Black's unified hosts list. The lists below are the ones most people add; each is fetched when gravity updates (every Sunday and right after this install). Unticking a list later does not remove it — manage lists in the admin UI under Lists.
  finalize: [pihole, -g]
  finalizeLabel: Updating gravity (downloads the lists)
  choices:
    - id: oisd-big
      label: OISD big
      description: The most popular all-round list. Blocks ads, trackers, malware, and scam domains with very few false positives.
      website: https://oisd.nl
      recommended: true
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://big.oisd.nl', 1, 'BoxPilot: OISD big' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://big.oisd.nl')"]
    - id: oisd-small
      label: OISD small
      description: A lighter OISD for households where the big list breaks something. Do not combine with OISD big.
      website: https://oisd.nl
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://small.oisd.nl', 1, 'BoxPilot: OISD small' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://small.oisd.nl')"]
    - id: hagezi-tif
      label: HaGeZi Threat Intelligence Feeds
      description: Malware, phishing, scam, and command-and-control domains. Safe to add on top of any other list.
      website: https://github.com/hagezi/dns-blocklists
      recommended: true
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/tif.txt', 1, 'BoxPilot: HaGeZi TIF' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/tif.txt')"]
    - id: hagezi-pro
      label: HaGeZi Multi PRO
      description: Aggressive ad, tracking, and telemetry blocking. Expect the occasional site to need an allow entry.
      website: https://github.com/hagezi/dns-blocklists
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt', 1, 'BoxPilot: HaGeZi Multi PRO' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt')"]
    - id: hagezi-normal
      label: HaGeZi Multi NORMAL
      description: Balanced ad and tracker blocking; the gentler alternative to PRO.
      website: https://github.com/hagezi/dns-blocklists
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/multi.txt', 1, 'BoxPilot: HaGeZi Multi NORMAL' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/multi.txt')"]
    - id: firebog-adguard-dns
      label: AdGuard DNS filter (via Firebog)
      description: AdGuard's own DNS-level ad list in hosts format, from the Firebog collection.
      website: https://firebog.net
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://v.firebog.net/hosts/AdguardDNS.txt', 1, 'BoxPilot: AdGuard DNS (Firebog)' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://v.firebog.net/hosts/AdguardDNS.txt')"]
    - id: firebog-easyprivacy
      label: EasyPrivacy (via Firebog)
      description: Tracking and telemetry domains from the EasyList project.
      website: https://firebog.net
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://v.firebog.net/hosts/Easyprivacy.txt', 1, 'BoxPilot: EasyPrivacy (Firebog)' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://v.firebog.net/hosts/Easyprivacy.txt')"]
    - id: smart-tv
      label: Smart TV telemetry
      description: Blocks phone-home and ad domains used by Samsung, LG, Roku, and other TVs.
      website: https://github.com/Perflyst/PiHoleBlocklist
      exec: [pihole-FTL, sqlite3, /etc/pihole/gravity.db, "INSERT INTO adlist (address, enabled, comment) SELECT 'https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt', 1, 'BoxPilot: Smart TV telemetry' WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = 'https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt')"]
notes: "Finish the setup in two steps: (1) on the Firewall page tick the DNS server service so other devices can reach port 53; (2) in your router's DHCP settings set the DNS server to this machine's LAN address. Ubuntu's systemd-resolved stub on 127.0.0.53 does not conflict. If port 53 is already taken, AdGuard Home or another resolver is installed."
