# BoxPilot catalog manifest (schemaVersion 2), pinned to the release it ships. Host port 8430 was free in
# the catalog on 2026-10-14. The Proton Mail Bridge runs as a sidecar.
schemaVersion: 2
id: financialauthority
name: FinancialAuthority
category: Finance
icon: "🏦"
description: "Reads your live transactions, paystubs, bills, payments, debts (including Affirm, Klarna, Afterpay and advance apps) and both your mailboxes, keeps itself current, and lets any model, including Claude on your phone, plan each paycheck, check a purchase, and suggest which billing dates to move. Never moves money. Uses this server's Ollama, any OpenAI-compatible server, or Claude."
website: https://github.com/AES256Afro/FinancialAuthority
risk: low
image:
  reference: ghcr.io/aes256afro/financialauthority:0.9.3@sha256:23bd3134a6adb1f38018ac89a195f61da9e3804ea13418c383267252b27e9507
  version: "0.9.3"
ports:
  - id: web
    label: Web UI, API and MCP
    container: 8000
    host: 8430
    exposure: lan
volumes:
  - id: data
    label: Ledger, bills, paystubs, rules, connector settings and the audit log
    container: /data
    path: data
    backup: true
  - id: restore-points
    label: The app's own restore points
    container: /restore-points
    path: restore-points
    backup: false
    description: Copies of the database the app takes before every import, once a day and on request, each read back before it counts, for its own undo on the Backups page. Left out of BoxPilot's archive of the app, which already holds the database itself, so the archive does not carry every copy inside it.
  - id: offbox
    label: Off-box copies
    container: /offbox
    hostPath: /srv/financialauthority-offbox
    configurable: true
    backup: false
    description: A folder on another disk (a USB drive, a second disk, or a folder Syncthing or rclone syncs to a cloud) where the app seals a passphrase-locked copy of its database daily or weekly. Point it at that disk's mount; set the passphrase on the app's Backups page.
  - id: imports
    label: Imports
    container: /imports
    hostPath: /srv/financialauthority-imports
    configurable: true
    backup: false
    description: Drop folder for bank CSV exports and paystub PDFs (a paystubs subfolder). Share it over SMB from Storage and a file copied in is imported; what is imported is kept in the data folder, which is backed up, so this folder isn't.
env:
  - name: FA_USERNAME
    label: Owner username
    default: owner
  - name: FA_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to sign in.
  - name: FA_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser and connected client out.
  - name: FA_DATA_KEY
    label: Data encryption key
    type: password
    generate: true
    description: Generated by BoxPilot. Encrypts mailbox passwords, the aggregator token and account numbers inside the database. Losing it loses those; the ledger itself stays readable.
  - name: FA_PUBLIC_URL
    label: Public address (optional)
    description: The https address this app is published at through the Cloudflare Tunnel app, for example https://money.example.com. Claude and other clients sign in through it. Leave empty until published; inside the tailnet the app works without it.
  - name: FA_OLLAMA_URL
    label: Where Ollama is
    description: The Ollama API. The default reaches this server's Ollama app while its reach is LAN. If Ollama is Tailscale-only, enter its tailnet address with port 11434.
    default: http://host.docker.internal:11434
  - name: FA_ANTHROPIC_API_KEY
    label: Anthropic API key (optional)
    type: password
    description: Lets the built-in chat use Claude. Mail bodies and account numbers are never sent; the redaction level for cloud models is set in Settings.
  - name: FA_OPENAI_BASE_URL
    label: OpenAI-compatible server (optional)
    description: Any server that speaks the OpenAI API, for example llama.cpp, vLLM or LocalAI on this network, or api.openai.com.
  - name: FA_OPENAI_API_KEY
    label: Key for that server (optional)
    type: password
  - name: FA_DATA_DIR
    default: /data
    fixed: true
  - name: FA_IMPORT_DIR
    default: /imports
    fixed: true
  - name: FA_RESTORE_DIR
    default: /restore-points
    fixed: true
  - name: FA_INSTALL
    default: boxpilot
    fixed: true
  - name: FA_OFFBOX_DIR
    default: /offbox
    fixed: true
  - name: FA_BRIDGE_CONTAINER
    default: bp-financialauthority-bridge
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
    description: Due dates, paydays and the morning brief are worked out in this zone.
extraHosts:
  - host.docker.internal:host-gateway
sidecars:
  - id: bridge
    image: ghcr.io/aes256afro/financialauthority-bridge:0.9.3@sha256:92ff6032155bb17174b6a157bd3f1fe98ebb1e0de03b2ec7e660e6bc996304bb  # the community Bridge plus libfido2; see deploy/bridge
    volumes:
      - id: bridge-state
        container: /root
        path: bridge
        backup: true
connections:
  - app: ollama
    role: model server
    where: install Ollama first and pull a chat model; FinancialAuthority reaches it at this server's port 11434
    note: Ollama is its own compose project, so FinancialAuthority reaches it through host.docker.internal rather than a container name. Without it the app still syncs, plans and briefs; only the built-in chat needs a model.
actions:
  - id: restore-point
    label: Take a restore point
    description: FinancialAuthority copies its whole database while it runs, reads the copy back and keeps it with its own restore points, to put back from its Settings > Backups. BoxPilot's backup of the app is separate.
    operation: app.financialauthority.restorepoint.make
  - id: check-backups
    label: Check the database and its copies
    description: SQLite checks every page of the live database and of the three newest restore points; shows how many copies the app keeps and how old the newest is, and leaves a note in the app of when it was checked.
    operation: app.financialauthority.backups.check
signIn:
  path: /
  port: web
  usernameEnv: FA_USERNAME
  passwordEnv: FA_PASSWORD
  note: BoxPilot generates the owner password. Mailbox, aggregator and Bridge credentials are entered inside the app and encrypted with the data key. Claude Desktop, Claude Code, claude.ai and other clients connect to /mcp and sign in once each; manage them on the app's Clients page.
health:
  kind: healthcheck
  timeoutSeconds: 300
notes: "It never moves money, and sends mail only after an approval or a standing allowance you granted. Proton Mail runs through the Bridge sidecar: sign in to it once from the server's console (the app's Connectors page shows the command), then enter the local IMAP password it prints. Banks connect through Plaid's free Trial plan or Teller's free developer tier, with your own developer keys pasted on the Connectors page and the bank's own login opened in the vendor's window; a Rocket Money export or paystub PDFs dropped into Imports backfill the rest. To reach it from anywhere, publish it with the Cloudflare Tunnel app and set the public address; claude.ai and Claude Code then sign in through the app's own consent page. Every recommendation shows the rows it was computed from and says it is not financial advice."
