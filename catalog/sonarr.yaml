schemaVersion: 2
id: sonarr
name: Sonarr
category: Media automation
icon: "📺"
description: Automates TV. Tell it the shows you follow and it finds new episodes through your indexers (Prowlarr), hands them to your download client (qBittorrent), renames the finished files, and sorts them into your library where Jellyfin picks them up.
website: https://sonarr.tv
risk: medium
image:
  reference: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322
  version: 4.0.19
ports:
  - id: web
    label: Web UI
    container: 8989
    host: 8989
    exposure: lan
volumes:
  - id: config
    label: Configuration
    container: /config
    path: config
  - id: media
    label: Media folder
    container: /data
    hostPath: /srv/media
    configurable: true
    backup: false
    description: The same folder qBittorrent uses, mounted at the same place inside (/data). That is what lets imports be instant hard-links on one filesystem instead of copies; downloads sit in /data/torrents and the library in /data/tv.
    subdirectories:
      - torrents
      - tv
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 10
  timeoutSeconds: 180
notes: "Point the root folder at /data/tv and the download client at qBittorrent on http://<this server>:8095 (category tv-sonarr). Indexers arrive through Prowlarr, which pushes them here by itself. On a network-share media folder Sonarr copies instead of hard-linking, which is fine, just slower."
