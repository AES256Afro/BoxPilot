schemaVersion: 2
id: sonarr
name: Sonarr
category: Media automation
icon: "📺"
description: "Finds, downloads, and organises TV series automatically. Tell it which shows you follow; it grabs new episodes through your download client and renames them for Jellyfin or Plex."
website: https://sonarr.tv
risk: low
image:
  reference: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321
  version: 4.0.19.2979
ports:
  - id: web
    label: Web UI
    container: 8989
    host: 8989
    exposure: lan
volumes:
  - id: config
    label: Configuration and database
    container: /config
    path: config
  - id: media
    label: Media folder
    container: /data
    hostPath: /srv/media
    configurable: true
    backup: false
    description: Shared media root for the whole stack; subfolders for tv, movies, music, torrents, and usenet keep imports as instant hard-links.
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 300
notes: "Setup order: Prowlarr first (indexers), then a download client (qBittorrent or SABnzbd), then here under Settings → Download clients and Media management. Keep everything under the same /srv/media folder (for example /srv/media/tv and /srv/media/torrents) so finished downloads are hard-linked instead of copied."
