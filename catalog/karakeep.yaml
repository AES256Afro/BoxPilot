schemaVersion: 2
id: karakeep
name: Karakeep
category: Knowledge
icon: "🧲"
description: "Bookmark everything (links, notes, images) and let a local or cloud AI tag it; full-text search with archived page copies. Formerly Hoarder."
website: https://karakeep.app
risk: low
image:
  reference: ghcr.io/karakeep-app/karakeep:0.33.2
  version: "0.33.2"
ports:
  - id: web
    label: Web UI
    container: 3000
    host: 3017
    exposure: lan
volumes:
  - id: data
    label: Database and archives
    container: /data
    path: data
env:
  - name: NEXTAUTH_SECRET
    label: Session secret
    type: password
    secret: true
    generate: true
  - name: MEILI_MASTER_KEY
    label: Search key
    type: password
    secret: true
    generate: true
  - name: MEILI_ADDR
    default: "http://meilisearch:7700"
    fixed: true
  - name: BROWSER_WEB_URL
    default: "http://chrome:9222"
    fixed: true
  - name: DATA_DIR
    default: "/data"
    fixed: true
  - name: NEXTAUTH_URL
    label: Address people use
    default: http://localhost:3017
  - name: OLLAMA_BASE_URL
    label: Ollama address for AI tagging
    description: Optional. Install Open WebUI + Ollama and use http://<this server>:11434 after exposing its port, or leave empty.
  - name: INFERENCE_TEXT_MODEL
    label: Tagging model
    default: llama3.2:3b
sidecars:
  - id: meilisearch
    image: getmeili/meilisearch:v1.13.3
    env:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - id: meili
        container: /meili_data
        path: meilisearch
  - id: chrome
    image: gcr.io/zenika-hub/alpine-chrome:124
    command: ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222", "--hide-scrollbars"]
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 600
notes: "Register the first account. The bundled Chrome takes the page screenshots; Meilisearch powers search."
