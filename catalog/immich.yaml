schemaVersion: 2
id: immich
name: Immich
category: Photos
icon: "📷"
description: Your own Google Photos. The phone app backs up every picture and video automatically; search by people, places, and what is in the photo; share albums with family. Everything stays on this server.
website: https://immich.app
risk: medium
image:
  reference: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
  version: v3.1.0
ports:
  - id: web
    label: Web UI and mobile app
    container: 2283
    host: 2283
    exposure: lan
volumes:
  - id: library
    label: Photo library
    container: /data
    hostPath: /srv/immich
    configurable: true
    backup: false
    description: Originals, thumbnails, and uploads. Put it on your biggest disk; it is not included in app backups because of its size.
env:
  - name: DB_HOSTNAME
    default: database
    fixed: true
  - name: DB_USERNAME
    default: postgres
    fixed: true
  - name: DB_DATABASE_NAME
    default: immich
    fixed: true
  - name: DB_PASSWORD
    label: Database password
    type: password
    secret: true
    generate: true
  - name: REDIS_HOSTNAME
    default: redis
    fixed: true
  - name: IMMICH_MACHINE_LEARNING_URL
    default: http://machine-learning:3003
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
sidecars:
  - id: redis
    image: valkey/valkey:9.1.1@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
  - id: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - id: pgdata
        container: /var/lib/postgresql/data
        path: postgres
  - id: machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    volumes:
      - id: cache
        container: /cache
        path: model-cache
        backup: false
health:
  kind: healthcheck
  stableSeconds: 10
  timeoutSeconds: 600
notes: "First visit creates the admin account. Install the Immich app on your phone, enter this server's address (use the Tailscale name after clicking Serve on tailnet so backups work away from home), and turn on automatic backup. The first machine-learning run downloads models (about 1 GB) and indexes faces and objects in the background; that can take hours for a large library. The database is included in app backups; the photo library is not, so copy it to the NAS or an external disk separately."
