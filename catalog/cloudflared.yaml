schemaVersion: 2
id: cloudflared
name: Cloudflare Tunnel
category: Network
icon: "☁️"
description: "Publish an app to the internet through Cloudflare without opening any port on your router: the tunnel connects out from this server, and Cloudflare serves the app over HTTPS at a name on your own domain. Set it up from this app's Tunnel tab with a Cloudflare API token, and publish apps from there."
website: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks
risk: medium
image:
  reference: cloudflare/cloudflared:2026.8.2
  version: "2026.8.2"
# The host's own network, so a published app is always at http://127.0.0.1:<its port>, whether it
# listens on the home network or on this server only (M42). It publishes no ports of its own.
network: host
command: ["tunnel", "--no-autoupdate", "run"]
env:
  - name: TUNNEL_TOKEN
    label: Tunnel token
    description: The Tunnel tab fills this in when you connect Cloudflare. To use a tunnel you made yourself, paste its token from the Cloudflare Zero Trust dashboard (Networks, Tunnels; the long string after --token).
    type: password
    required: true
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 180
notes: "Use the Tunnel tab: paste a Cloudflare API token once, then publish an app at a name on your domain; BoxPilot makes the tunnel, the DNS name and the route. With a tunnel you made in the Cloudflare dashboard instead, send each public hostname to http://127.0.0.1:<the app's port>; this app shares the server's own network, so 127.0.0.1 is this server. Nothing listens on this server for the tunnel; it only connects out."
