schemaVersion: 2
id: minio
name: MinIO
category: Backup
icon: "🪣"
description: "S3-compatible object storage on your own disk. A backup target for Immich, Kopia, Duplicati, and Restic, and a bucket store for anything that speaks S3."
website: https://github.com/pgsty/minio
risk: low
image:
  # MinIO stopped publishing community images: minio/minio (Docker Hub) and quay.io/minio/minio
  # both answer 401 now, for every tag. pgsty/minio is a maintained community build of the same
  # AGPL source (same entrypoint, command and data layout), so existing /srv/minio data keeps working.
  reference: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  version: "2026-08-04"
command: ["server", "/data", "--console-address", ":9001"]
ports:
  - id: api
    label: S3 API
    container: 9000
    host: 9000
    exposure: lan
  - id: console
    label: Console
    container: 9001
    host: 9001
    exposure: lan
volumes:
  - id: data
    label: Buckets
    container: /data
    hostPath: /srv/minio
    configurable: true
    backup: false
    description: Where the objects live. Put it on your biggest disk.
env:
  - name: MINIO_ROOT_USER
    label: Admin access key
    default: admin
  - name: MINIO_ROOT_PASSWORD
    label: Admin secret key
    type: password
    secret: true
    generate: true
signIn:
  path: /login
  usernameEnv: MINIO_ROOT_USER
  passwordEnv: MINIO_ROOT_PASSWORD
health:
  kind: running
  stableSeconds: 10
  timeoutSeconds: 180
notes: "Apps connect to http://<this server>:9000 with the access and secret keys from Secrets; the console on port 9001 creates buckets and extra users, and the mc command-line tool does the same. This is the pgsty community build of MinIO, because MinIO no longer publishes free images."
