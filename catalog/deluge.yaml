schemaVersion: 2
id: deluge
name: Deluge
category: Media automation
icon: "💧"
description: Torrent client built around plugins — label your downloads, run scripts when one finishes, or drive it from a desktop client over its own remote protocol.
website: https://deluge-torrent.org
risk: medium
image:
  reference: lscr.io/linuxserver/deluge:version-2.2.0
  version: 2.2.0
ports:
  - id: web
    label: Web UI
    container: 8112
    host: 8112
    exposure: lan
  - id: daemon
    label: Remote client (deluge-console, Thin Client)
    container: 58846
    host: 58846
    exposure: loopback
  - id: peer-tcp
    label: Peer connections (TCP)
    container: 6881
    host: 6881
    exposure: lan
    tailnet: address   # the BitTorrent peer protocol, not HTTP
  - id: peer-udp
    label: Peer connections (UDP)
    container: 6881
    host: 6881
    protocol: udp
    exposure: lan
volumes:
  - id: config
    label: Configuration and torrent state
    container: /config
    path: config
  - id: media
    label: Media folder
    container: /data
    hostPath: /srv/media
    configurable: true
    backup: false
    description: Download into /srv/media/torrents so the *arr apps can hard-link finished files into the library.
env:
  - name: PUID
    default: "1000"
    fixed: true
  - name: PGID
    default: "1000"
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
health:
  kind: running
  stableSeconds: 15
  timeoutSeconds: 240
notes: "The web UI's first password is \"deluge\" — change it under Preferences → Interface immediately. The remote-client port is kept on this server only; open it deliberately if you want to drive Deluge from a desktop app."
