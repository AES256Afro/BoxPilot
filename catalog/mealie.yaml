schemaVersion: 2
id: mealie
name: Mealie
category: Household
icon: "🍲"
description: Recipe manager and meal planner with recipe import from any URL.
website: https://mealie.io
risk: low
image:
  reference: ghcr.io/mealie-recipes/mealie:v3.23.1@sha256:5fc5cebedddb3952c1ee78f20faf42ab7e49986813fd314745aa97978a4a13eb
  version: v3.23.1
ports:
  - id: web
    label: Web UI
    container: 9000
    host: 9925
    exposure: lan
volumes:
  - id: data
    label: Data
    container: /app/data
    path: data
# The setting that holds the app's public address, so Hosted domains watches it once it is set.
publicHostname:
  env: BASE_URL
env:
  - name: ALLOW_SIGNUP
    label: Allow sign-up
    type: boolean
    default: false
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: BASE_URL
    label: Base URL
    description: Optional, e.g. http://192.168.1.10:9925.
health:
  kind: running
  stableSeconds: 15
notes: Default login is changeme@example.com / MyPassword. Change it immediately.
