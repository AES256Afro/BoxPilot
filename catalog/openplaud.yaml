schemaVersion: 2
id: openplaud
name: OpenPlaud
category: AI
icon: "🎙️"
description: "Turns your Plaud recorder's recordings into meeting notes, action items or follow-up emails with the model you choose: Claude, ChatGPT, or a local model such as Qwen on this server's Ollama. Reads your recordings through Plaud's official connector, syncs new ones on a schedule, and keeps every note as Markdown."
website: https://github.com/AES256Afro/OpenPlaud
risk: low
# It holds meeting notes and API keys, so it starts on the tailnet only; the Reach tab can open it to the home network.
defaultExposure: tailnet
image:
  reference: ghcr.io/aes256afro/openplaud:0.6.0
  version: "0.6.0"
user: "1000:1000"
ports:
  - id: web
    label: Web UI
    container: 8795
    host: 8795
    exposure: lan
volumes:
  - id: data
    label: Notes and Plaud sign-in
    container: /data
    path: data
    description: Every note written, the record of which recordings are done, and the Plaud sign-in.
# Reaches this server's Ollama, which publishes port 11434 on the host.
extraHosts: ["host.docker.internal:host-gateway"]
connections:
  - app: ollama
    role: Local models
    where: Settings → Ollama address and Local model
    note: Only used when the model provider is local.
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: OPENPLAUD_PROVIDER
    label: Model provider
    description: "claude uses the Claude API, chatgpt the OpenAI API, local this server's Ollama. Only the chosen provider's key and model are used."
    default: claude
    options: ["claude", "chatgpt", "local"]
  - name: ANTHROPIC_API_KEY
    label: Claude API key
    type: password
    secret: true
    description: From console.anthropic.com. Needed when the provider is claude.
    default: ""
  - name: CLAUDE_MODEL
    label: Claude model
    description: Haiku is fast and costs about a cent for a long meeting; Sonnet and Opus write more careful notes for more.
    default: claude-haiku-5-5
    options: ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]
  - name: OPENAI_API_KEY
    label: OpenAI API key
    type: password
    secret: true
    description: From platform.openai.com. Needed when the provider is chatgpt.
    default: ""
  - name: OPENAI_MODEL
    label: ChatGPT model
    description: Any model name your OpenAI account can use.
    default: gpt-5-mini
  - name: OLLAMA_URL
    label: Ollama address
    description: This server's Ollama app is at http://host.docker.internal:11434. Point it elsewhere to use Ollama on another machine.
    default: http://host.docker.internal:11434
  - name: LOCAL_MODEL
    label: Local model
    optionsFrom: ollama-models
    description: The model used when the provider is local. Without a graphics card, qwen3:30b-a3b takes a few minutes per short recording.
    default: qwen3:30b-a3b
  - name: OPENPLAUD_TASK
    label: Automatic notes
    description: "What each synced recording gets: summary (meeting notes), actions (action items only) or followup (a follow-up email draft). Any recording can also be run by hand with another."
    default: summary
    options: ["summary", "actions", "followup"]
  - name: OPENPLAUD_SYNC_EVERY
    label: Check Plaud every (minutes)
    type: number
    description: How often new recordings are fetched and get notes. 0 turns automatic checks off.
    default: "60"
  - name: OPENPLAUD_SYNC_DAYS
    label: Look back (days)
    type: number
    description: How far back each check looks for recordings that have no notes yet.
    default: "7"
  - name: OPENPLAUD_LOOK
    label: Look
    description: "How the page is laid out: inbox (folders, list and reader), timeline (a day-by-day feed), actions (action items from every note), command (a keyboard palette), board (columns from new to filed), reader (notes beside the transcript), library (folder tiles), calendar (a week view), phone (one column) or console (sync and status). Each browser can also pick its own from the page."
    default: inbox
    options: ["inbox", "timeline", "actions", "command", "board", "reader", "library", "calendar", "phone", "console"]
  - name: OPENPLAUD_CHECK_TOKEN
    label: Check token
    type: password
    secret: true
    generate: true
    description: "Generated by BoxPilot. Lets a phone shortcut or another service start a check right away: POST https://<this server>:8795/api/check with the header Authorization: Bearer <this token>. It needs no page password."
  - name: OPENPLAUD_CHECK_ON_OPEN
    label: Check when the page opens (minutes)
    type: number
    description: Opening the page checks Plaud when the last check is older than this. 0 turns it off.
    default: "5"
  - name: OPENPLAUD_MONTHLY_CAP
    label: Monthly spending cap (dollars)
    type: number
    description: "Most to spend on paid models in a calendar month; 0 means no cap. Once reached, paid runs wait for next month. Models without a known price are refused while a cap is set (see Model prices)."
    default: "0"
  - name: OPENPLAUD_PRICES
    label: Model prices (optional)
    description: "Prices for ChatGPT models, in dollars per million input/output tokens, e.g. gpt-5-mini=0.25/2. Claude prices are built in."
    default: ""
  - name: OPENPLAUD_LONG_MINUTES
    label: Long recordings (minutes, optional)
    type: number
    description: Recordings longer than this use the long-recording model below. 0 turns the rule off.
    default: "0"
  - name: OPENPLAUD_LONG_MODEL
    label: Long-recording model (optional)
    description: "provider:model, e.g. claude:claude-sonnet-5-5 or local:qwen3:30b-a3b."
    default: ""
  - name: OPENPLAUD_ALLOWED_HOSTS
    label: Extra host names (optional)
    description: "Only needed if you open the page under your own domain name. Tailnet names, IP addresses and .local names always work."
    default: ""
  - name: CLAUDE_ROUTINE_URL
    label: Claude fire URL (optional)
    description: "Send to Claude: the Fire URL of a Claude scheduled task's API trigger, from claude.ai/code/routines. Each new recording then opens as its own session in your Claude account (claude.ai/code and the Claude app), on your Claude subscription. The page's Claude button shows the prompt to give the task."
    default: ""
  - name: CLAUDE_ROUTINE_TOKEN
    label: Claude token (optional)
    type: password
    secret: true
    description: The token generated for that API trigger. It is only ever sent to api.anthropic.com.
    default: ""
  - name: OPENPLAUD_PASSWORD
    label: Password
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Opens the web page.
signIn:
  path: /
  port: web
  passwordEnv: OPENPLAUD_PASSWORD
  note: The page asks for this password only; there is no username.
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Open the page, enter the password from this card, and choose Start Plaud sign-in. Approve access
  on Plaud's page; your browser then lands on a localhost:8199 address that does not load. Copy that
  address into OpenPlaud within two minutes to finish. Recordings then sync on the schedule above,
  and each one can be run by hand as meeting notes, action items or a follow-up email. Notes are
  kept as Markdown in this app's data folder and can be downloaded from the page.
