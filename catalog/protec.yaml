schemaVersion: 2
id: protec
name: Protec
category: Administration
icon: "▣"
description: "Self-hosted device enrollment, package inventory, device-scoped API access, recoverable token rotation, inventory completion receipts, and audit history."
website: https://foragefournuts.com
risk: low
image:
  reference: ghcr.io/aes256afro/protec:0.5.0
  version: "0.5.0"
user: "10001:10001"
ports:
  - id: web
    label: Management portal
    container: 8765
    host: 8765
    exposure: loopback
volumes:
  - id: data
    label: Fleet database and identity
    container: /data
    path: data
env:
  - name: PROTEC_PUBLIC_URL
    label: Portal HTTPS origin
    required: true
    description: "The exact HTTPS address used to open the portal, including its port if needed. Publish the loopback port with Tailscale Serve or configure an HTTPS reverse proxy. Example: https://server.example.ts.net:8765"
  - name: PROTEC_ADMIN_TOKEN
    label: Administrator token
    type: password
    generate: true
    description: "Generated by BoxPilot. Use 32 to 128 letters, digits, underscores, or hyphens if replacing it. Restarting with a changed token immediately replaces administrator access."
signIn:
  path: /
  port: web
  passwordEnv: PROTEC_ADMIN_TOKEN
  note: "Copy the administrator token into the portal's Access token field. There is no username. Named credentials can be issued from Access."
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Plan a Tailscale Serve or reverse-proxy HTTPS address and enter its origin before installation.
  The container port binds only to loopback; publish it through your chosen HTTPS service.
  Back up before upgrading to 0.5: schema 5 requires the pre-upgrade database for rollback.
  Linux and macOS inventory agents connect outbound to the portal. Device privileges are
  reported; this release does not install packages, enforce policies, manage VPN routes,
  or run remote shells. Explore mock data at https://foragefournuts.com/demo/.
