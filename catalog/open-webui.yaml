schemaVersion: 2
id: open-webui
name: Open WebUI + Ollama
category: AI
icon: "🤖"
description: ChatGPT-style chat that runs entirely on this server. Ollama serves the models; Open WebUI is the chat interface with history, documents, and multiple users. Pick a starter model below; nothing you type leaves the house.
website: https://docs.openwebui.com
risk: medium
image:
  reference: ghcr.io/open-webui/open-webui:v0.11.0
  version: v0.11.0
ports:
  - id: web
    label: Chat UI
    container: 8080
    host: 8088
    exposure: lan
volumes:
  - id: data
    label: Chats, accounts, and your uploaded knowledge
    container: /app/backend/data
    path: data
    description: Everything you have taught it — uploaded documents, saved websites, chat history and accounts. This is what backups protect; the models themselves are excluded because they are large and can be downloaded again.
env:
  - name: OLLAMA_BASE_URL
    default: http://ollama:11434
    fixed: true
  - name: WEBUI_SECRET_KEY
    label: Session secret
    type: password
    secret: true
    generate: true
  - name: ENABLE_SIGNUP
    label: Let others create accounts
    description: The first account created becomes the admin; turn this off afterwards if only you should use it.
    type: boolean
    default: true
  - name: ENABLE_OPENAI_API
    default: "false"
    fixed: true
sidecars:
  - id: ollama
    image: ollama/ollama:0.32.15
    volumes:
      - id: models
        container: /root/.ollama
        path: models
        backup: false
health:
  kind: running
  stableSeconds: 20
  timeoutSeconds: 600
setup:
  title: Starter models
  note: "Models download once into this app's folder (sizes shown), and can be removed later from Admin → Models. Without a GPU everything runs on the CPU: 3-8 B models answer at reading speed on a modern processor, and Qwen3 30B-A3B is the exception that reasons like a big model while only doing ~3 B of work per word. Pick the embedding model too if you want to chat with your own documents."
  choices:
    - id: llama32-3b
      label: Llama 3.2 3B
      description: Meta's small general model, about 2 GB. Good default for a CPU.
      website: https://ollama.com/library/llama3.2
      recommended: true
      service: ollama
      exec: [ollama, pull, "llama3.2:3b"]
    - id: gemma3-4b
      label: Gemma 3 4B
      description: Google's small model, about 3.3 GB; strong at writing and can read images.
      website: https://ollama.com/library/gemma3
      service: ollama
      exec: [ollama, pull, "gemma3:4b"]
    - id: hermes3-8b
      label: Hermes 3 8B
      description: Nous Research's assistant model, about 4.7 GB. Follows a system prompt closely and is trained for tool calling, which suits an agent that has to do what it is told.
      website: https://ollama.com/library/hermes3
      service: ollama
      exec: [ollama, pull, "hermes3:8b"]
    - id: qwen3-8b
      label: Qwen 3 8B
      description: Alibaba's current 8 B model, about 5.2 GB. A good general default with strong reasoning for its size.
      website: https://ollama.com/library/qwen3
      service: ollama
      exec: [ollama, pull, "qwen3:8b"]
    - id: qwen3-14b
      label: Qwen 3 14B
      description: About 9.3 GB. Noticeably better at hard questions; still usable on a CPU with patience.
      website: https://ollama.com/library/qwen3
      service: ollama
      exec: [ollama, pull, "qwen3:14b"]
    - id: qwen3-30b-a3b
      label: Qwen 3 30B-A3B (best on a CPU)
      description: "About 19 GB and needs roughly 24 GB of memory free. A mixture-of-experts model: 30 B of knowledge but only ~3 B active per word, so it reasons far above its speed. The best answer quality you can get from a server with no GPU."
      website: https://ollama.com/library/qwen3
      service: ollama
      exec: [ollama, pull, "qwen3:30b-a3b"]
    - id: qwen25-7b
      label: Qwen 2.5 7B
      description: The previous generation, about 4.7 GB. Keep it only if something you use expects it.
      website: https://ollama.com/library/qwen2.5
      service: ollama
      exec: [ollama, pull, "qwen2.5:7b"]
    - id: qwen25-coder-7b
      label: Qwen 2.5 Coder 7B
      description: Code-focused, about 4.7 GB.
      website: https://ollama.com/library/qwen2.5-coder
      service: ollama
      exec: [ollama, pull, "qwen2.5-coder:7b"]
    - id: nomic-embed
      label: nomic-embed-text (for documents)
      description: Small embedding model (270 MB) so you can chat with uploaded documents.
      website: https://ollama.com/library/nomic-embed-text
      recommended: true
      service: ollama
      exec: [ollama, pull, "nomic-embed-text"]
notes: "Open the chat UI and create the first account: it becomes the admin. To chat with your own material, pick the embedding model above, then use Workspaces → Knowledge to upload documents or paste a website address — answers then quote your own files, and nothing is sent anywhere. Backups cover that knowledge and your chats; downloaded models are deliberately excluded, so a restore re-downloads them. Models run on the CPU unless a GPU is passed through (not yet supported by BoxPilot). Other apps on this server can use Ollama too: Home Assistant's Ollama integration, for example, talks to it at http://<this server>:11434 after you expose that port with a Settings change."
