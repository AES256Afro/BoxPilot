# TheySpy (schemaVersion 2). Source of truth: AES256Afro/TheySpy boxpilot/theyspy.yaml, whose CI
# validates it with this repository's validateManifest. The image is pinned to the digest the v0.6.0
# release published, an image index for amd64 and arm64: signed keylessly, with an SBOM and build
# provenance attested by GitHub.
# Port 8797 is free in the BoxPilot catalog (BaselineWatch 8790, Protec 8765, BoxPilot itself 8787).
# This version runs in bridge mode with no extra capabilities. Network discovery in a later release
# switches to `network: host` with CAP_NET_RAW and CAP_NET_ADMIN, as NetAlertX does, and raises risk to medium.
schemaVersion: 2
id: theyspy
name: TheySpy
category: Security
icon: "🕵️"
description: "Watches for ad-delivered spyware. Hunts your Pi-hole's DNS history for zero-breach's AdFection / Candiru indicators and blocks what your lists miss. Keeps a categorised library of DNS blocklists, updated automatically behind safety checks, and suggests a blocking level per device (Essential to Lockdown) with a preview of what it would block on your own traffic."
website: https://github.com/AES256Afro/TheySpy
risk: low
image:
  reference: ghcr.io/aes256afro/theyspy:0.6.0@sha256:194de49e09d72846502ff11aa315b93d647d8b708efc030c27191c0630600bc9
  version: "0.6.0"
user: "1000:1000"
ports:
  - id: web
    label: Dashboard
    container: 8797
    host: 8797
    exposure: lan
volumes:
  - id: data
    label: Database, indicator sets and scan history
    container: /data
    path: data
    description: One SQLite file plus downloaded feeds. Restoring it brings back every device, finding and setting.
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: TS_ADMIN_PASSWORD
    label: Owner password
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Needed to sign in.
  - name: TS_SESSION_SECRET
    label: Session signing secret
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Changing it signs everyone out without touching data.
  - name: TS_LOOK
    label: Default look
    description: How every screen is drawn unless a browser chooses otherwise in Settings → Appearance. "auto" keeps each screen's own look.
    default: auto
    options: ["auto", "ops", "light", "pihole", "evidence", "paper", "glass"]
  - name: TS_BRAND_NAME
    label: Name shown in the app
    default: TheySpy
  - name: TS_BRAND_TAGLINE
    label: Tagline (optional)
    default: ""
  - name: TS_ACCENT
    label: Accent colour (optional)
    description: "A colour such as #39c6ff. Empty uses the look's own accent."
    default: ""
  - name: TS_PIHOLE_URL
    label: Pi-hole address (optional)
    description: "Pi-hole 6's web address as TheySpy reaches it, such as http://<this server>:8084. Empty: connect it on the Pi-hole Sentinel screen instead."
    default: ""
  - name: TS_PIHOLE_PASSWORD
    label: Pi-hole app password (optional)
    type: password
    secret: true
    description: An app password from Pi-hole → Settings → Web interface / API, so it can be revoked on its own.
    default: ""
  - name: TS_BLOCKLISTS_AUTO
    label: Keep blocklists up to date
    type: boolean
    default: "true"
    description: Updates the enabled blocklists every 6 hours and looks for new ones daily. New lists only become candidates; updates that look wrong are held for review.
  - name: TS_IOC_AUTOCHECK
    label: Check for indicator updates daily
    type: boolean
    default: "true"
    description: Looks for a newer zero-breach indicator set once a day. An update waits on the Indicators screen until you apply it.
connections:
  - app: pi-hole
    role: DNS history and denylist
    where: Pi-hole Sentinel → Connect Pi-hole, or the Pi-hole address and app password here
    note: On this server use http://<server address>:8084 when Pi-hole runs in Bridge mode, or port 80 in Host mode. TheySpy changes Pi-hole only after you allow it on that screen.
signIn:
  path: /
  port: web
  passwordEnv: TS_ADMIN_PASSWORD
  note: There is no username. Change the password here; TheySpy reads it at every start.
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Open the dashboard and sign in with the owner password from this card. Settings → Appearance
  picks the look and branding; the defaults for everyone can also be set here. Activity shows
  every job and change. Pi-hole Sentinel connects to Pi-hole 6, hunts its history for lookups of
  spyware and ad-intelligence indicators, watches new queries every 30 seconds, and can add the
  indicator domains your lists miss (and roll that back). Indicators holds zero-breach's set, checks
  GitHub daily for a signed update and exports it for DNS filters, MVT and MISP. The blocklist
  library and baselines arrive next, then network discovery.
