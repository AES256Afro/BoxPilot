<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1014" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />
    <meta name="description" content="Ubuntu server setup and management" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BoxPilot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BoxPilot</title>
    <script>
      (function () {
        // Before first paint, so the page never flashes the other theme. src/useTheme.ts owns
        // the attribute after this and reads the same key; anything but light or dark there (an
        // old palette id from before the palettes were retired) means System.
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('boxpilot-theme');
          if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
        } catch (error) { /* no storage: follow the device */ }
        // The look (src/looks/useLook.ts), for the same reason. Home keeps the Launcher when the
        // look is set for every page but Home; App.tsx says which look each page is drawn in.
        var look = 'blend';
        try {
          var stored = localStorage.getItem('boxpilot-look');
          var looks = ['blend', 'launcher', 'console', 'aqua', 'blueprint', 'phosphor', 'rack', 'swiss', 'toybox', 'cockpit', 'eink', 'quest', 'transit'];
          if (looks.indexOf(stored) >= 0) look = stored;
          var view = new URLSearchParams(location.search).get('view');
          var notHome = localStorage.getItem('boxpilot-look-scope') === 'not-home';
          root.setAttribute('data-look-scope', notHome ? 'not-home' : 'all');
          if (notHome && (!view || view === 'home')) look = 'launcher';
          // Only the choices Settings offers (ACCENTS and WALLPAPERS in src/looks/looks.ts); the
          // default, sea, sets no attribute.
          var accent = localStorage.getItem('boxpilot-accent');
          if (['amber', 'blue', 'violet', 'rose', 'graphite'].indexOf(accent) >= 0) root.setAttribute('data-accent', accent);
          var wallpaper = localStorage.getItem('boxpilot-wallpaper');
          if (['dusk', 'meadow', 'plain'].indexOf(wallpaper) >= 0) root.setAttribute('data-wallpaper', wallpaper);
          if (localStorage.getItem('boxpilot-solid') === '1') root.setAttribute('data-solid', '');
        } catch (error) { /* no storage: the default look */ }
        root.setAttribute('data-look', look);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
