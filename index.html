<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4f7" />
    <meta name="description" content="Ubuntu server setup and management" />
    <title>BoxPilot</title>
    <script>
      (function () {
        // Before first paint, so the page never flashes the other theme. src/useTheme.ts owns
        // the attribute after this and reads the same key; anything but light or dark there (an
        // old palette id from before the palettes were retired) means System.
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('boxpilot-theme');
          if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
        } catch (error) { /* no storage: follow the device */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
